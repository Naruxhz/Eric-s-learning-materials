<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuropsikiatri (CSL) — Atlas Belajar Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFE9;
  --bg-panel:#FFFFFF;
  --ink:#1C1B19;
  --muted:#6E6A62;
  --line:#DEDACE;
  --red:#4A3F9F;
  --red-deep:#2F2873;
  --red-tint:#EAE7F8;
  --teal:#1E5B5E;
  --teal-tint:#E3EFEC;
  --amber:#B9832E;
  --amber-tint:#F8ECD8;
  --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 8px 24px rgba(28,27,25,0.05);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{
  font-family:'Fraunces', serif;
  font-weight:600;
  margin:0;
  letter-spacing:-0.01em;
}
.mono{font-family:'IBM Plex Mono', monospace;}
::selection{background:var(--red-tint); color:var(--red-deep);}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}

/* Sidebar */
#sidebar{
  width:290px;
  flex-shrink:0;
  background:var(--bg-panel);
  border-right:1px solid var(--line);
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  padding:20px 14px 40px;
}
.sb-brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 8px 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
  transition:opacity .15s ease;
}
.sb-brand:hover{opacity:0.7;}
.back-home-link{
  display:flex; align-items:center; gap:6px;
  font-size:11.5px; color:var(--muted); font-weight:600;
  padding:7px 8px; margin-bottom:6px; border-radius:7px;
  cursor:pointer; text-decoration:none; width:fit-content;
}
.back-home-link:hover{background:var(--bg); color:var(--red-deep);}
.back-home-link svg{flex-shrink:0;}
.sb-brand .cell{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #8f84e0, var(--red-deep) 70%);
  box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.15);
  flex-shrink:0;
}
.sb-brand .t1{font-size:17px; line-height:1.1;}
.sb-brand .t2{font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-top:2px;}
.watermark{
  font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); opacity:0.55;
  text-align:right; margin:-8px 4px 14px 0; letter-spacing:0.02em;
}

.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:16px;
}
.search-box input{
  border:none; background:transparent; outline:none;
  font-size:13.5px; width:100%; color:var(--ink); font-family:inherit;
}
.search-box svg{flex-shrink:0; opacity:0.5;}

.mode-toggle{
  display:flex; background:var(--bg); border:1px solid var(--line);
  border-radius:8px; padding:3px; margin-bottom:18px; gap:3px;
}
.mode-toggle button{
  flex:1; border:none; background:transparent; padding:8px 6px;
  border-radius:6px; font-size:12.5px; font-weight:600; color:var(--muted);
  cursor:pointer; transition:all .15s ease;
}
.mode-toggle button.active{background:var(--red); color:#fff; box-shadow:var(--shadow);}

.nav-cat{margin-bottom:4px;}
.nav-cat-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 8px; cursor:pointer; border-radius:7px;
  font-size:13px; font-weight:600;
  user-select:none;
}
.nav-cat-head:hover{background:var(--bg);}
.nav-cat-head .chev{transition:transform .18s ease; opacity:0.5;}
.nav-cat-head .badge-count{
  font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted);
  background:var(--bg); border:1px solid var(--line); border-radius:20px;
  padding:1px 7px; margin-left:6px;
}
.nav-cat.open .chev{transform:rotate(90deg);}
.nav-list{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.nav-cat.open .nav-list{max-height:1200px;}
.nav-item{
  display:flex; align-items:center; gap:8px;
  padding:7px 8px 7px 22px; font-size:13px; cursor:pointer;
  border-radius:7px; color:var(--muted); position:relative;
}
.nav-item:hover{background:var(--bg); color:var(--ink);}
.nav-item.active{background:var(--red-tint); color:var(--red-deep); font-weight:600;}
.nav-item .dot{width:5px;height:5px;border-radius:50%; background:currentColor; opacity:0.5; flex-shrink:0;}
.nav-item .check{
  margin-left:auto; width:14px; height:14px; border-radius:50%;
  border:1.5px solid var(--line); flex-shrink:0;
}
.nav-item .check.done{background:var(--teal); border-color:var(--teal);}

.sb-progress{
  margin-top:20px; padding:12px; background:var(--bg); border-radius:8px; border:1px solid var(--line);
}
.sb-progress .lbl{font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:6px;}
.sb-progress .bar{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
.sb-progress .fill{height:100%; background:linear-gradient(90deg, var(--teal), #2a7a7d); border-radius:4px; transition:width .3s ease;}
.sb-progress-foot{
  display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px;
}
.sb-progress-foot span{font-size:10px; color:var(--muted); opacity:0.8;}
.sb-progress-foot button{
  border:none; background:transparent; color:var(--muted); font-size:10.5px; font-weight:600;
  cursor:pointer; text-decoration:underline; padding:0; flex-shrink:0;
}
.sb-progress-foot button:hover{color:var(--red);}

/* Main */
#main{flex:1; min-width:0;}
.topbar{
  position:sticky; top:0; z-index:5;
  background:rgba(241,239,233,0.88); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 40px; display:none; align-items:center; gap:10px;
}
.hamburger{display:none; border:1px solid var(--line); background:#fff; border-radius:8px; width:36px; height:36px; align-items:center; justify-content:center; cursor:pointer;}

.content-wrap{max-width:880px; margin:0 auto; padding:56px 40px 120px;}
</style>
</head>
<body>
<style>
/* ---------- Hero (home view) ---------- */
.hero{padding-bottom:12px;}
.hero .eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--red); display:flex; align-items:center; gap:8px; margin-bottom:14px;
}
.hero .eyebrow::before{content:""; width:20px; height:1px; background:var(--red);}
.hero h1{font-size:clamp(34px,5vw,52px); line-height:1.02;}
.hero h1 em{font-style:italic; color:var(--red);}
.hero p.lede{font-size:16.5px; color:var(--muted); max-width:560px; margin-top:16px;}
.hero-stats{display:flex; gap:28px; margin-top:30px; flex-wrap:wrap;}
.hero-stats .stat b{font-family:'Fraunces',serif; font-size:28px; display:block;}
.hero-stats .stat span{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}

/* Signature: MCV algorithm widget */
.algo-widget{
  margin-top:40px; background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
  padding:28px 28px 24px; box-shadow:var(--shadow);
}
.algo-widget h3{font-size:16px; margin-bottom:4px;}
.algo-widget .sub{font-size:12.5px; color:var(--muted); margin-bottom:20px;}
.algo-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.algo-btn{
  flex:1; min-width:150px; text-align:left; border:1.5px solid var(--line); background:var(--bg);
  border-radius:9px; padding:12px 14px; cursor:pointer; transition:all .15s ease;
}
.algo-btn b{display:block; font-size:13.5px; font-family:'IBM Plex Mono',monospace;}
.algo-btn span{font-size:11.5px; color:var(--muted);}
.algo-btn:hover{border-color:var(--red); background:var(--red-tint);}
.algo-btn.picked{border-color:var(--red); background:var(--red-tint); box-shadow:inset 0 0 0 1px var(--red);}
.algo-result{
  margin-top:16px; padding:16px 18px; border-radius:10px; background:var(--teal-tint);
  border:1px solid #c8ddd9; font-size:13.5px; min-height:20px;
}
.algo-result .rlabel{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--teal); font-weight:600; margin-bottom:6px;}
.algo-result .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.chip{
  background:#fff; border:1px solid var(--line); padding:5px 11px; border-radius:20px; font-size:12.5px;
  font-family:'IBM Plex Mono', monospace; cursor:pointer;
}
.chip:hover{border-color:var(--teal); color:var(--teal);}

.home-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-top:44px;}
.home-card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:18px;
  cursor:pointer; transition:all .15s ease;
}
.home-card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:#cfc9ba;}
.home-card .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--red); margin-bottom:8px;}
.home-card h4{font-size:15.5px;}
.home-card p{font-size:12.5px; color:var(--muted); margin-top:6px;}

/* ---------- Topic page ---------- */
.crumbs{font-size:12px; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:6px;}
.crumbs .sep{opacity:0.5;}
.topic-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px;}
.topic-head h1{font-size:clamp(28px,4vw,40px);}
.badge-level{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:#fff;
  background:var(--red); border-radius:6px; padding:4px 9px; flex-shrink:0; margin-top:6px;
  white-space:nowrap;
}
.topic-sub{color:var(--muted); font-size:14.5px; margin-bottom:8px;}
.mark-btn{
  display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--line); background:#fff;
  padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; margin:18px 0 8px;
  color:var(--muted);
}
.mark-btn.done{border-color:var(--teal); background:var(--teal-tint); color:var(--teal);}
.mark-btn .dotc{width:9px;height:9px;border-radius:50%; border:1.5px solid currentColor;}
.mark-btn.done .dotc{background:var(--teal);}

.section-block{margin-top:30px;}
.section-block h2{
  font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--red);
  font-family:'IBM Plex Mono', monospace; font-weight:600;
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.section-block h2::after{content:""; flex:1; height:1px; background:var(--line);}
.section-block ul{margin:0; padding-left:20px;}
.section-block li{margin-bottom:7px; font-size:14.5px;}
.section-block p{font-size:14.5px; margin:0 0 10px;}
.section-block .sub-h{font-weight:600; font-size:14px; margin-top:14px; margin-bottom:6px; font-family:'Fraunces',serif;}

.extra-wrap{margin-top:34px; border-top:2px dashed var(--line); padding-top:26px;}
.extra-wrap-head{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.extra-wrap-head .tag{
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.06em;
  color:#fff; background:var(--teal); padding:3px 9px; border-radius:20px; text-transform:uppercase;
}
.extra-wrap-head b{font-family:'Fraunces',serif; font-size:16px;}
.extra-wrap-note{font-size:12px; color:var(--muted); margin-bottom:18px;}
.extra-block{margin-top:22px;}
.extra-block h3{
  font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--teal);
  font-family:'IBM Plex Mono', monospace; font-weight:600; display:flex; align-items:center; gap:10px; margin-bottom:10px;
}
.extra-block h3::after{content:""; flex:1; height:1px; background:var(--line);}
.extra-block ul{margin:0; padding-left:20px;}
.extra-block li{margin-bottom:7px; font-size:14px;}

.topic-images{display:flex; gap:14px; flex-wrap:wrap; margin:18px 0;}
.topic-image-card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
  overflow:hidden; width:200px; flex-shrink:0; box-shadow:var(--shadow);
}
.topic-image-card img{display:block; width:100%; height:auto;}
.topic-image-card .cap{padding:9px 11px; font-size:11.5px; color:var(--muted); line-height:1.4;}
@media (max-width:640px){ .topic-image-card{width:100%;} }

.callout{
  border-radius:10px; padding:16px 18px; margin:14px 0; font-size:13.5px; border:1px solid;
}
.callout.mnemonic{background:var(--amber-tint); border-color:#e3caa0;}
.callout.mnemonic .clabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--amber); font-weight:700; margin-bottom:6px;}
.callout.key{background:var(--red-tint); border-color:#c9c3ea;}
.callout.key .clabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--red-deep); font-weight:700; margin-bottom:6px;}

table.data-tbl{width:100%; border-collapse:collapse; margin:14px 0; font-size:13px;}
table.data-tbl th, table.data-tbl td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top;}
table.data-tbl th{background:var(--bg); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);}
table.data-tbl tr:nth-child(even) td{background:#fbfaf7;}

.topic-nav{display:flex; justify-content:space-between; margin-top:56px; padding-top:22px; border-top:1px solid var(--line); gap:14px;}
.tn-btn{flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:14px 16px; cursor:pointer; max-width:48%;}
.tn-btn .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}
.tn-btn .ttl{font-family:'Fraunces',serif; font-size:15px; margin-top:3px;}
.tn-btn.next{text-align:right; margin-left:auto;}

/* ---------- Quiz ---------- */
.quiz-shell{max-width:680px; margin:0 auto; padding:56px 40px 100px;}
.quiz-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:26px;}
.quiz-progress-track{height:6px; background:var(--line); border-radius:4px; flex:1; margin:0 16px; overflow:hidden;}
.quiz-progress-fill{height:100%; background:var(--red); border-radius:4px; transition:width .3s ease;}
.quiz-count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted); white-space:nowrap;}
.qcard{background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:var(--shadow);}
.qcard .vignette{font-size:15px; line-height:1.65; margin-bottom:20px;}
.qcard .question{font-weight:600; font-size:15px; margin-bottom:18px; font-family:'Fraunces',serif;}
.opt{
  display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border:1.5px solid var(--line);
  border-radius:9px; margin-bottom:10px; cursor:pointer; font-size:14px; transition:all .12s ease;
}
.opt:hover{border-color:#c9a; background:var(--red-tint);}
.opt .lt{
  width:24px;height:24px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600;
  font-family:'IBM Plex Mono',monospace;
}
.opt.correct{border-color:var(--teal); background:var(--teal-tint);}
.opt.correct .lt{background:var(--teal); border-color:var(--teal); color:#fff;}
.opt.wrong{border-color:var(--red); background:var(--red-tint);}
.opt.wrong .lt{background:var(--red); border-color:var(--red); color:#fff;}
.opt.disabled{cursor:default;}
.opt.disabled:hover{background:none;}
.opt.dim{opacity:0.55;}

.qexplain{margin-top:16px; padding:15px 16px; background:var(--bg); border-radius:9px; font-size:13.5px; border-left:3px solid var(--teal); display:none;}
.qexplain.show{display:block;}
.qexplain b{color:var(--teal);}
.qnext-row{display:flex; justify-content:flex-end; margin-top:18px;}
.btn-primary{
  background:var(--red); color:#fff; border:none; padding:11px 22px; border-radius:8px;
  font-weight:600; font-size:13.5px; cursor:pointer;
}
.btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
.btn-ghost{background:transparent; border:1.5px solid var(--line); padding:11px 22px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer;}
.btn-ghost:disabled{opacity:0.35; cursor:not-allowed;}

.quiz-result{text-align:center; padding:40px 20px;}
.quiz-result .score{font-family:'Fraunces',serif; font-size:64px; margin:14px 0;}
.quiz-result .score span{font-size:28px; color:var(--muted);}

/* ---------- Flow / algorithm diagrams (from PPT schemes) ---------- */
.flowcard{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
  padding:22px 22px 20px; margin-top:14px;
}
.flowcard .fnote{font-size:12px; color:var(--muted); margin-bottom:16px;}
.fstep{
  display:flex; align-items:center; gap:12px; margin-bottom:10px;
}
.fstep .fbox{
  background:var(--bg); border:1.5px solid var(--line); border-radius:9px; padding:10px 14px;
  font-size:13px; font-weight:600; flex-shrink:0;
}
.fstep .farrow{color:var(--muted); font-size:15px; flex-shrink:0;}
.fstep .fresult{font-size:13px; color:var(--muted);}
.fsplit{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:10px 0 4px;}
.fsplit.three{grid-template-columns:1fr 1fr 1fr;}
.fbranch{
  border:1.5px solid var(--line); border-radius:10px; padding:14px 15px; background:var(--bg);
}
.fbranch.red{border-color:#c9c3ea; background:var(--red-tint);}
.fbranch.teal{border-color:#b7d4cf; background:var(--teal-tint);}
.fbranch.amber{border-color:#e3caa0; background:var(--amber-tint);}
.fbranch .flabel{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--muted); margin-bottom:6px; font-weight:600;
}
.fbranch.red .flabel{color:var(--red-deep);}
.fbranch.teal .flabel{color:var(--teal);}
.fbranch.amber .flabel{color:var(--amber);}
.fbranch .fhead{font-family:'Fraunces',serif; font-size:15px; margin-bottom:6px;}
.fbranch ul{margin:0; padding-left:16px;}
.fbranch li{font-size:12.5px; margin-bottom:4px;}
.fbranch p{font-size:12.5px; margin:0;}
.fdivider{
  display:flex; align-items:center; gap:8px; margin:16px 0 10px; font-size:11px;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'IBM Plex Mono',monospace;
}
.fdivider::before, .fdivider::after{content:""; flex:1; height:1px; background:var(--line);}
.fseq{counter-reset:fseq; margin-top:6px;}
.fseq-item{
  counter-increment:fseq; display:flex; gap:14px; padding:12px 0; border-top:1px solid var(--line);
}
.fseq-item:first-child{border-top:none;}
.fseq-item .fnum{
  width:26px; height:26px; border-radius:50%; background:var(--red); color:#fff; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
}
.fseq-item .fbody b{display:block; font-size:13.5px; margin-bottom:3px;}
.fseq-item .fbody span{font-size:12.5px; color:var(--muted);}
@media (max-width:640px){
  .fsplit, .fsplit.three{grid-template-columns:1fr;}
}

/* ---------- GCS calculator ---------- */
.gcs-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
.gcs-grid label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-weight:600; margin-bottom:5px;}
.gcs-grid select{width:100%; padding:10px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--bg); font-family:inherit; font-size:13px; color:var(--ink);}
.gcs-grid select:focus{outline:none; border-color:var(--red);}
.gcs-score{font-family:'Fraunces',serif; font-size:34px; line-height:1;}

  "answer": 2,
  "explain": "Pemeriksaan kesadaran: <b>observasi</b> (inspeksi keterjagaan dan kewaspadaan) → <b>stimulasi</b> (verbal dahulu, lalu nyeri) → <b>dokumentasi</b> skor."
 }
];
</script>
<script>
/* =========================================================
   APP LOGIC
   ========================================================= */
const state = {
  view:'home',        // home | topic | quiz
  topicId:null,
  done:new Set(),
  quizIdx:0,
  quizAnswers:[],      // array parallel to QUIZ: null (unanswered) or {chosen, correct}
};

/* ---------- Progress persistence (localStorage) ---------- */
const PROGRESS_KEY = 'neuropsikiatri-progress-v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed.done)) state.done = new Set(parsed.done);
  }catch(e){ console.warn('Gagal memuat progres tersimpan:', e); }
}
function saveProgress(){
  try{
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({ done:[...state.done] }));
  }catch(e){ console.warn('Gagal menyimpan progres:', e); }
}

const QUIZ_PROGRESS_KEY = 'neuropsikiatri-quiz-progress-v1';
function loadQuizProgress(){
  try{
    const raw = localStorage.getItem(QUIZ_PROGRESS_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed.quizAnswers) || parsed.quizAnswers.length!==QUIZ.length) return null;
    return parsed;
  }catch(e){ console.warn('Gagal memuat progres kuis:', e); return null; }
}
function saveQuizProgress(){
  try{
    localStorage.setItem(QUIZ_PROGRESS_KEY, JSON.stringify({ quizIdx:state.quizIdx, quizAnswers:state.quizAnswers }));
  }catch(e){ console.warn('Gagal menyimpan progres kuis:', e); }
}
function clearQuizProgress(){
  try{ localStorage.removeItem(QUIZ_PROGRESS_KEY); }catch(e){}
}

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const viewRoot = $('#viewRoot');

function esc(s){ return (s+'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function findTopic(id){ return TOPICS.find(t=>t.id===id); }
function topicsInCat(catId){ return TOPICS.filter(t=>t.cat===catId); }

/* ---------- Sidebar / Nav tree ---------- */
function renderNavTree(filter){
  const q = (filter||'').trim().toLowerCase();
  const groups = {};
  CATEGORIES.forEach(c=>{
    const group = c.group || '__solo__';
    if(!groups[group]) groups[group] = [];
    groups[group].push(c);
  });

  let html = '';
  Object.keys(groups).forEach(groupKey=>{
    const cats = groups[groupKey];
    cats.forEach(cat=>{
      let topics = topicsInCat(cat.id);
      if(q){
        topics = topics.filter(t =>
          t.title.toLowerCase().includes(q) ||
          (t.sub||'').toLowerCase().includes(q) ||
          JSON.stringify(t.sections||[]).toLowerCase().includes(q)
        );
      }
      if(q && topics.length===0) return;
      const isOpen = !!q || cat.id === (findTopic(state.topicId)||{}).cat;
      const label = groupKey!=='__solo__' ? `${groupKey} · ${cat.label}` : cat.label;
      html += `<div class="nav-cat ${isOpen?'open':''}" data-cat="${cat.id}">
        <div class="nav-cat-head">
          <span>${esc(label)}</span>
          <span style="display:flex;align-items:center;">
            <span class="badge-count">${topics.length}</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </div>
        <div class="nav-list">
          ${topics.map(t=>`
            <div class="nav-item ${t.id===state.topicId?'active':''}" data-topic="${t.id}">
              <span class="dot"></span>
              <span>${esc(t.title)}</span>
              <span class="check ${state.done.has(t.id)?'done':''}"></span>
            </div>`).join('')}
        </div>
      </div>`;
    });
  });
  $('#navTree').innerHTML = html;

  $$('.nav-cat-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      h.closest('.nav-cat').classList.toggle('open');
    });
  });
  $$('.nav-item').forEach(it=>{
    it.addEventListener('click', ()=>{
      goTopic(it.dataset.topic);
      closeSidebarMobile();
    });
  });
  updateProgress();
}

function updateProgress(){
  $('#progressLabel').textContent = `${state.done.size} / ${TOPICS.length}`;
  $('#progressFill').style.width = (state.done.size/TOPICS.length*100)+'%';
}

/* ---------- Home / Hero view ---------- */
function renderHome(push){
  state.view='home'; state.topicId=null;
  if(push!==false){ history.pushState({view:'home'}, '', '#'); }
  setActiveModeButtons();
  viewRoot.innerHTML = `
  <div class="content-wrap">
    <div class="hero reveal">
      <div class="eyebrow">By Naruxhz</div>
      <h1>Peta <em>Neuropsikiatri</em><br>untuk CSL &amp; OSCE.</h1>
      <p class="lede">Rangkuman interaktif ${TOPICS.length} topik keterampilan klinis neuropsikiatri — dari GCS, nervus kranialis, dan refleks patologis hingga anamnesis serta status mental psikiatri — lengkap dengan tabel banding, mnemonic, dan ${QUIZ.length} soal latihan.</p>
      <div class="hero-stats">
        <div class="stat"><b>${TOPICS.length}</b><span>Topik Klinis</span></div>
        <div class="stat"><b>${QUIZ.length}</b><span>Soal Latihan</span></div>
        <div class="stat"><b>${CATEGORIES.length}</b><span>Kategori</span></div>
      </div>
    </div>

    <div class="algo-widget reveal">
      <h3>Coba: Kalkulator Glasgow Coma Scale</h3>
      <div class="sub">Pilih respons terbaik pasien pada tiap komponen untuk melihat skor total dan kategorinya.</div>
      <div class="gcs-grid">
        <div><label for="gcsE">Eye (E)</label><select id="gcsE">
          <option value="4">E4 — Spontan</option><option value="3">E3 — Terhadap suara</option><option value="2">E2 — Terhadap nyeri</option><option value="1">E1 — Tidak ada</option></select></div>
        <div><label for="gcsV">Verbal (V)</label><select id="gcsV">
          <option value="5">V5 — Berorientasi baik</option><option value="4">V4 — Bingung</option><option value="3">V3 — Kata tidak tepat</option><option value="2">V2 — Mengerang</option><option value="1">V1 — Tidak ada</option></select></div>
        <div><label for="gcsM">Motorik (M)</label><select id="gcsM">
          <option value="6">M6 — Menurut perintah</option><option value="5">M5 — Melokalisasi nyeri</option><option value="4">M4 — Menghindar</option><option value="3">M3 — Fleksi abnormal (dekortikasi)</option><option value="2">M2 — Ekstensi (deserebrasi)</option><option value="1">M1 — Tidak ada</option></select></div>
      </div>
      <div class="algo-result" id="gcsResult"></div>
    </div>

    <div style="margin-top:52px;">
      <h2 style="font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); font-weight:600;">Jelajahi semua topik</h2>
      <div class="home-grid">
        ${TOPICS.map((t,i)=>`
          <div class="home-card reveal" style="animation-delay:${Math.min(i*18,300)}ms" data-topic="${t.id}">
            <div class="n">${esc(t.level)} · ${esc(CATEGORIES.find(c=>c.id===t.cat).label)}</div>
            <h4>${esc(t.title)}</h4>
            <p>${esc(t.sub||'')}</p>
          </div>`).join('')}
      </div>
    </div>
  </div>`;

  function updateGcs(){
    const e=+$('#gcsE').value, v=+$('#gcsV').value, m=+$('#gcsM').value, tot=e+v+m;
    let cat = tot===15 ? 'Normal (sadar penuh)' : tot>=13 ? 'Cedera kepala ringan' : tot>=9 ? 'Cedera kepala sedang' : 'Cedera kepala berat / koma';
    $('#gcsResult').innerHTML = `<div class="rlabel">Hasil</div><div class="gcs-score">${tot}<small>E${e} V${v} M${m}</small></div><div style="margin-top:6px;">${cat}</div><div class="chips"><span class="chip" data-topic="gcs">Pelajari: GCS</span></div>`;
    $$('#gcsResult .chip').forEach(c=>c.addEventListener('click', ()=>goTopic(c.dataset.topic)));
  }
  ['#gcsE','#gcsV','#gcsM'].forEach(s=>$(s).addEventListener('change', updateGcs));
  updateGcs();

  $$('.home-card').forEach(c=>c.addEventListener('click', ()=>goTopic(c.dataset.topic)));
}

/* ---------- Topic view ---------- */
function renderSectionList(items){
  return `<ul>${items.map(li=>`<li>${li}</li>`).join('')}</ul>`;
}
function renderSection(sec){
  let inner = '';
  if(sec.list) inner += renderSectionList(sec.list);
  if(sec.sub){
    sec.sub.forEach(s=>{
      inner += `<div class="sub-h">${esc(s.t)}</div>${renderSectionList(s.list)}`;
    });
  }
  return `<div class="section-block reveal"><h2>${esc(sec.h)}</h2>${inner}</div>`;
}
function renderTable(tbl){
  return `<div class="section-block reveal"><h2>${esc(tbl.title)}</h2>
    <table class="data-tbl"><thead><tr>${tbl.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${tbl.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function goTopic(id, push){
  state.view='topic'; state.topicId=id;
  if(push!==false){ history.pushState({view:'topic', topicId:id}, '', '#'+id); }
  setActiveModeButtons();
  const t = findTopic(id);
  const cat = CATEGORIES.find(c=>c.id===t.cat);
  const idx = TOPICS.indexOf(t);
  const prev = TOPICS[idx-1], next = TOPICS[idx+1];

  viewRoot.innerHTML = `
  <div class="content-wrap">
    <div class="crumbs reveal">
      <span>${esc(cat.group ? cat.group : 'Neuropsikiatri')}</span>
      <span class="sep">/</span>
      <span>${esc(cat.label)}</span>
    </div>
    <div class="topic-head reveal">
      <h1>${esc(t.title)}</h1>
      <span class="badge-level">${esc(t.level)}</span>
    </div>
    <div class="topic-sub reveal">${esc(t.sub||'')}</div>
    <button class="mark-btn ${state.done.has(id)?'done':''}" id="markBtn">
      <span class="dotc"></span>
      <span id="markBtnLabel">${state.done.has(id)?'Sudah dipelajari':'Tandai sudah dipelajari'}</span>
    </button>

    ${(t.sections||[]).map(renderSection).join('')}
    ${t.images ? `<div class="topic-images reveal">${t.images.map(im=>`
      <div class="topic-image-card">
        <img src="${esc(im.src)}" alt="${esc(im.alt||im.caption||'')}" loading="lazy">
        <div class="cap">${esc(im.caption||'')}</div>
      </div>`).join('')}</div>` : ''}
    ${t.diagram ? `<div class="section-block reveal"><h2>${esc(t.diagram.title||'Skema / Algoritma')}</h2><div class="flowcard">${t.diagram.note?`<div class="fnote">${esc(t.diagram.note)}</div>`:''}${t.diagram.html}</div></div>` : ''}
    ${t.mnemonic ? `<div class="callout mnemonic reveal"><div class="clabel">Mnemonic — ${esc(t.mnemonic.label)}</div>${esc(t.mnemonic.text)}</div>` : ''}
    ${t.table ? renderTable(t.table) : ''}
    ${t.extra ? `<div class="extra-wrap reveal">
      <div class="extra-wrap-head"><span class="tag">+ Referensi Tambahan</span><b>Pendalaman Klinis</b></div>
      <div class="extra-wrap-note">Wawasan tambahan di luar penuntun CSL — dari literatur kedokteran standar, untuk memperkaya pemahaman.</div>
      ${t.extra.map(e=>`<div class="extra-block"><h3>${esc(e.h)}</h3><ul>${e.list.map(li=>`<li>${li}</li>`).join('')}</ul></div>`).join('')}
    </div>` : ''}

    <div class="topic-nav">
      ${prev ? `<button class="tn-btn prev" data-topic="${prev.id}"><div class="lbl">← Sebelumnya</div><div class="ttl">${esc(prev.title)}</div></button>` : '<div></div>'}
      ${next ? `<button class="tn-btn next" data-topic="${next.id}"><div class="lbl">Selanjutnya →</div><div class="ttl">${esc(next.title)}</div></button>` : '<div></div>'}
    </div>
  </div>`;

  $('#markBtn').addEventListener('click', ()=>{
    if(state.done.has(id)) state.done.delete(id); else state.done.add(id);
    saveProgress();
    goTopic(id, false);
    renderNavTree($('#searchInput').value);
  });
  $$('.tn-btn[data-topic]').forEach(b=>b.addEventListener('click', ()=>goTopic(b.dataset.topic)));

  renderNavTree($('#searchInput').value);
  window.scrollTo({top:0, behavior:'instant'});
}
</script>
<script>
/* ---------- Quiz view ---------- */
function quizScoreSoFar(){
  return state.quizAnswers.reduce((n,a)=> n + (a && a.correct ? 1 : 0), 0);
}
function quizAnsweredCount(){
  return state.quizAnswers.reduce((n,a)=> n + (a ? 1 : 0), 0);
}

function startQuiz(push, forceRestart){
  state.view='quiz'; state.topicId=null;
  const saved = forceRestart ? null : loadQuizProgress();
  if(saved){
    state.quizIdx = saved.quizIdx;
    state.quizAnswers = saved.quizAnswers;
  } else {
    state.quizIdx = 0;
    state.quizAnswers = new Array(QUIZ.length).fill(null);
    clearQuizProgress();
  }
  if(push!==false){ history.pushState({view:'quiz'}, '', '#quiz'); }
  setActiveModeButtons();
  renderQuizQuestion();
  renderNavTree($('#searchInput').value);
  window.scrollTo({top:0, behavior:'instant'});
}

function renderQuizQuestion(){
  const q = QUIZ[state.quizIdx];
  const total = QUIZ.length;
  const letters = ['A','B','C','D','E'];
  const already = state.quizAnswers[state.quizIdx]; // {chosen, correct} or null
  const isLast = state.quizIdx===total-1;
  const allAnswered = quizAnsweredCount()===total;

  viewRoot.innerHTML = `
  <div class="quiz-shell">
    <div class="quiz-top">
      <span class="quiz-count mono">SOAL ${state.quizIdx+1} / ${total}</span>
      <div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:${(state.quizIdx)/total*100}%"></div></div>
      <span class="quiz-count mono" id="quizScoreLabel">SKOR ${quizScoreSoFar()}</span>
    </div>
    <div class="qcard reveal">
      <div class="vignette">${esc(q.vignette)}</div>
      <div class="question">${esc(q.question)}</div>
      <div id="optsWrap">
        ${q.options.map((opt,i)=>`
          <div class="opt${already ? ' disabled' : ''}${already && i===q.answer ? ' correct' : ''}${already && !already.correct && i===already.chosen ? ' wrong' : ''}${already && i!==q.answer && i!==already.chosen ? ' dim' : ''}" data-i="${i}">
            <div class="lt">${letters[i]}</div>
            <div>${esc(opt)}</div>
          </div>`).join('')}
      </div>
      <div class="qexplain${already ? ' show' : ''}" id="qexplain"><b>Pembahasan.</b> ${q.explain}</div>
      <div class="qnext-row" style="justify-content:space-between;">
        <button class="btn-ghost" id="qPrevBtn" ${state.quizIdx===0 ? 'disabled' : ''}>← Soal Sebelumnya</button>
        <button class="btn-primary" id="qNextBtn" ${already ? '' : 'disabled'}>${isLast ? 'Lihat Hasil' : 'Soal Berikutnya →'}</button>
      </div>
    </div>
  </div>`;

  if(!already){
    $$('.opt').forEach(optEl=>{
      optEl.addEventListener('click', ()=>{
        if(state.quizAnswers[state.quizIdx]) return;
        const chosen = parseInt(optEl.dataset.i,10);
        const correct = chosen===q.answer;
        state.quizAnswers[state.quizIdx] = {chosen, correct};
        saveQuizProgress();
        $$('.opt').forEach(o=>{
          o.classList.add('disabled');
          const i = parseInt(o.dataset.i,10);
          if(i===q.answer) o.classList.add('correct');
          else if(i===chosen) o.classList.add('wrong');
          else o.classList.add('dim');
        });
        $('#qexplain').classList.add('show');
        $('#qNextBtn').disabled = false;
        $('#quizScoreLabel').textContent = `SKOR ${quizScoreSoFar()}`;
      });
    });
  }

  $('#qPrevBtn').addEventListener('click', ()=>{
    if(state.quizIdx>0){
      state.quizIdx--;
      saveQuizProgress();
      renderQuizQuestion();
      window.scrollTo({top:0, behavior:'instant'});
    }
  });

  $('#qNextBtn').addEventListener('click', ()=>{
    if(!state.quizAnswers[state.quizIdx]) return;
    if(!isLast){
      state.quizIdx++;
      saveQuizProgress();
      renderQuizQuestion();
      window.scrollTo({top:0, behavior:'instant'});
    } else {
      renderQuizResult();
    }
  });
}

function renderQuizResult(){
  const total = QUIZ.length;
  const score = quizScoreSoFar();
  const pct = Math.round(score/total*100);
  let msg = 'Terus berlatih, sedikit lagi!';
  if(pct>=80) msg = 'Mantap — pemahamanmu sudah kuat.';
  else if(pct>=60) msg = 'Bagus, tinjau ulang topik yang masih salah.';
  clearQuizProgress();
  viewRoot.innerHTML = `
  <div class="quiz-shell">
    <div class="qcard quiz-result reveal">
      <div class="quiz-count mono">HASIL KUIS</div>
      <div class="score">${score}<span>/${total}</span></div>
      <p style="color:var(--muted); font-size:14px;">${msg}</p>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap;">
        <button class="btn-primary" id="retryBtn">Ulangi Kuis</button>
        <button class="btn-ghost" id="homeBtn">Kembali ke Beranda</button>
      </div>
    </div>
  </div>`;
  $('#retryBtn').addEventListener('click', ()=> startQuiz(true, true));
  $('#homeBtn').addEventListener('click', ()=> renderHome());
}

/* ---------- Mode toggle / sidebar wiring ---------- */
function setActiveModeButtons(){
  $('#btnModeBelajar').classList.toggle('active', state.view!=='quiz');
  $('#btnModeQuiz').classList.toggle('active', state.view==='quiz');
}
$('#btnModeBelajar').addEventListener('click', ()=>{ if(state.view==='quiz') renderHome(); });
$('#sbBrandHome').addEventListener('click', ()=>{ renderHome(); closeSidebarMobile(); });
$('#resetProgressBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(confirm('Reset semua progres belajar (topik yang sudah ditandai selesai)? Tindakan ini tidak bisa dibatalkan.')){
    state.done.clear();
    saveProgress();
    renderNavTree($('#searchInput').value);
    if(state.view==='topic') goTopic(state.topicId, false);
  }
});
$('#btnModeQuiz').addEventListener('click', startQuiz);

$('#searchInput').addEventListener('input', (e)=>{
  renderNavTree(e.target.value);
});

/* Mobile sidebar */
const sidebarEl = $('#sidebar'), overlayEl = $('#sbOverlay');
function openSidebarMobile(){ sidebarEl.classList.add('open'); overlayEl.classList.add('show'); }
function closeSidebarMobile(){ sidebarEl.classList.remove('open'); overlayEl.classList.remove('show'); }
$('#hamburgerBtn').addEventListener('click', openSidebarMobile);
overlayEl.addEventListener('click', closeSidebarMobile);

/* Browser back/forward support */
window.addEventListener('popstate', (e)=>{
  const st = e.state;
  if(!st || st.view==='home'){ renderHome(false); }
  else if(st.view==='topic' && findTopic(st.topicId)){ goTopic(st.topicId, false); }
  else if(st.view==='quiz'){ startQuiz(false); }
  else { renderHome(false); }
  closeSidebarMobile();
});

/* Init */
loadProgress();
$('#quizCountLabel').textContent = QUIZ.length;
renderNavTree('');
const initialHash = decodeURIComponent(location.hash.replace('#',''));
if(initialHash && findTopic(initialHash)){
  history.replaceState({view:'topic', topicId:initialHash}, '', '#'+initialHash);
  goTopic(initialHash, false);
} else if(initialHash === 'quiz'){
  history.replaceState({view:'quiz'}, '', '#quiz');
  startQuiz(false);
} else {
  history.replaceState({view:'home'}, '', '#');
  renderHome(false);
}
</script>
</body>
</html>
