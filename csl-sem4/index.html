<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penuntun OSCE Semester 4 — Gastrointestinal & Reproduksi-Tumbuh Kembang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFE9;
  --bg-panel:#FFFFFF;
  --ink:#1C1B19;
  --muted:#6E6A62;
  --line:#DEDACE;
  --teal:#1E5B5E;
  --teal-deep:#123F41;
  --teal-tint:#E3EFEC;
  --amber:#B9832E;
  --amber-tint:#F8ECD8;
  --rose:#9E2A3D;
  --rose-tint:#F6E4E6;
  --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 8px 24px rgba(28,27,25,0.05);
  --radius: 10px;
  --accent: var(--teal);
  --accent-deep: var(--teal-deep);
  --accent-tint: var(--teal-tint);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
h1,h2,h3,h4{font-family:'Fraunces', serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono', monospace;}
::selection{background:var(--accent-tint); color:var(--accent-deep);}
a{color:inherit;}
button{font-family:inherit;}

#app{display:flex; min-height:100vh;}

/* Sidebar */
#sidebar{width:300px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:20px 14px 40px;}
.sb-brand{display:flex; align-items:center; gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;cursor:pointer;transition:opacity .15s ease;}
.sb-brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 8px 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
  transition:opacity .15s ease;
}
.sb-brand:hover{opacity:0.7;}
.back-home-link{
  display:flex; align-items:center; gap:6px;
  font-size:11.5px; color:var(--teal-deep); font-weight:600;
  padding:7px 8px; margin-bottom:6px; border-radius:7px;
  cursor:pointer; text-decoration:none; width:fit-content;
}
.back-home-link:hover{background:var(--bg); color:var(--red-deep);}
.back-home-link svg{flex-shrink:0;}
.sb-brand .cell{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 32% 30%, #2f8a8d, var(--teal-deep) 70%);box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.15);flex-shrink:0;}
.sb-brand .t1{font-size:16px; line-height:1.15;}
.sb-brand .t2{font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); margin-top:2px;}
.watermark{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); opacity:0.55;text-align:right; margin:-8px 4px 14px 0;}

.search-box{display:flex; align-items:center; gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:16px;}
.search-box input{border:none; background:transparent; outline:none;font-size:13.5px; width:100%; color:var(--ink); font-family:inherit;}
.search-box svg{flex-shrink:0; opacity:0.5;}

.blok-toggle{display:flex; background:var(--bg); border:1px solid var(--line);border-radius:8px; padding:3px; margin-bottom:16px; gap:3px;}
.blok-toggle button{flex:1; border:none; background:transparent; padding:8px 5px;border-radius:6px; font-size:11.5px; font-weight:600; color:var(--muted);cursor:pointer; transition:all .15s ease;}
.blok-toggle button.active{background:var(--accent); color:#fff; box-shadow:var(--shadow);}

.nav-cat{margin-bottom:4px;}
.nav-cat-head{display:flex; align-items:center; justify-content:space-between;padding:9px 8px; cursor:pointer; border-radius:7px;font-size:12.5px; font-weight:700; user-select:none; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);}
.nav-cat-head:hover{background:var(--bg);}
.nav-item{display:flex; align-items:center; gap:8px;padding:8px 8px 8px 12px; font-size:13.5px; cursor:pointer;border-radius:7px; color:var(--ink); position:relative; margin-bottom:2px;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--accent-tint); color:var(--accent-deep); font-weight:600;}
.nav-item .dot{width:5px;height:5px;border-radius:50%; background:currentColor; opacity:0.5; flex-shrink:0;}

/* Main */
#main{flex:1; min-width:0;}
.topbar{position:sticky; top:0; z-index:5;background:rgba(241,239,233,0.88); backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 40px; display:none; align-items:center; gap:10px;}
.hamburger{display:none; border:1px solid var(--line); background:#fff; border-radius:8px; width:36px; height:36px; align-items:center; justify-content:center; cursor:pointer;}
.content-wrap{max-width:900px; margin:0 auto; padding:56px 40px 120px;}

/* Hero */
.hero{padding-bottom:12px;}
.hero .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.12em;text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.hero .eyebrow::before{content:""; width:20px; height:1px; background:var(--accent);}
.hero h1{font-size:clamp(32px,4.6vw,48px); line-height:1.04;}
.hero h1 em{font-style:italic; color:var(--accent);}
.hero p.lede{font-size:16px; color:var(--muted); max-width:600px; margin-top:16px;}
.hero-stats{display:flex; gap:28px; margin-top:28px; flex-wrap:wrap;}
.hero-stats .stat b{font-family:'Fraunces',serif; font-size:26px; display:block;}
.hero-stats .stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}

.blok-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:40px;}
@media(max-width:700px){.blok-grid{grid-template-columns:1fr;}}
.blok-card{border-radius:14px; padding:22px; cursor:pointer; transition:all .15s ease; border:1.5px solid var(--line);}
.blok-card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
.blok-card.gastro{background:var(--rose-tint); border-color:#e0b7bd;}
.blok-card.repro{background:var(--teal-tint); border-color:#b7d4cf;}
.blok-card.active-blok{box-shadow:0 0 0 2px var(--ink), var(--shadow);}
.blok-card.active-blok .bn::after{content:" · aktif"; opacity:0.7; font-weight:600;}
.blok-card .bn{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; font-weight:700;}
.blok-card.gastro .bn{color:var(--rose);}
.blok-card.repro .bn{color:var(--teal);}
.blok-card h3{font-size:20px; margin-bottom:6px;}
.blok-card p{font-size:13px; color:var(--muted); margin:0;}

.home-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-top:16px;}
.home-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:18px;cursor:pointer; transition:all .15s ease;}
.home-card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:#cfc9ba;}
.home-card .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent); margin-bottom:8px;}
.home-card h4{font-size:15px;}
.home-card p{font-size:12.5px; color:var(--muted); margin-top:6px;}

/* Topic page */
.crumbs{font-size:12px; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:6px;}
.crumbs .sep{opacity:0.5;}
.topic-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px;}
.topic-head h1{font-size:clamp(26px,3.6vw,38px);}
.badge-blok{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; color:#fff;border-radius:6px; padding:4px 9px; flex-shrink:0; margin-top:6px; white-space:nowrap;}
.badge-blok.gastro{background:var(--rose);}
.badge-blok.repro{background:var(--teal);}
.topic-sub{color:var(--muted); font-size:14.5px; margin-bottom:20px;}

.tabbar{display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin-bottom:26px; overflow-x:auto;}
.tabbar button{border:none; background:transparent; padding:10px 16px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; margin-bottom:-1.5px;}
.tabbar button.active{color:var(--accent-deep); border-bottom-color:var(--accent);}
.tabpane{display:none;}
.tabpane.show{display:block;}

.section-block{margin-top:26px;}
.section-block:first-child{margin-top:0;}
.section-block h2{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent);font-family:'IBM Plex Mono', monospace; font-weight:600;display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.section-block h2::after{content:""; flex:1; height:1px; background:var(--line);}
.section-block ul{margin:0; padding-left:20px;}
.section-block li{margin-bottom:8px; font-size:14.5px;}
.section-block p{font-size:14.5px; margin:0 0 10px;}
.sub-h{font-weight:600; font-size:13.5px; margin-top:16px; margin-bottom:6px; font-family:'Fraunces',serif; color:var(--accent-deep);}

.callout{border-radius:10px; padding:16px 18px; margin:14px 0; font-size:13.5px; border:1px solid;}
.callout.mnemonic{background:var(--amber-tint); border-color:#e3caa0;}
.callout.mnemonic .clabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--amber); font-weight:700; margin-bottom:6px;}
.callout.key{background:var(--accent-tint); border-color:#b7d4cf;}
.callout.key .clabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-deep); font-weight:700; margin-bottom:6px;}

table.data-tbl{width:100%; border-collapse:collapse; margin:14px 0; font-size:13px;}
table.data-tbl th, table.data-tbl td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top;}
table.data-tbl th{background:var(--bg); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);}
table.data-tbl tr:nth-child(even) td{background:#fbfaf7;}

/* Prosedur steps */
.proc-group{margin-top:20px;}
.proc-group-title{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#fff; background:var(--accent); display:inline-block; padding:5px 11px; border-radius:20px; margin-bottom:10px;}
.proc-step{display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:14px;}
.proc-group .proc-step:first-of-type{border-top:none;}
.proc-step .pn{width:24px;height:24px;border-radius:50%; background:var(--bg); border:1.5px solid var(--line); flex-shrink:0;display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--muted); margin-top:1px;}
.proc-step .pb{flex:1;}
.proc-step .pb .note{color:var(--rose); font-style:italic; font-size:12.5px; margin-top:4px;}

/* Daftar tilik table */
.tilik-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.tilik-head .id-fields{font-size:12.5px; color:var(--muted); display:flex; gap:18px; flex-wrap:wrap;}
.tilik-head .id-fields input{border:none; border-bottom:1px solid var(--line); background:transparent; font-family:inherit; font-size:12.5px; padding:2px 4px; width:140px;}
.btn-mini{border:1.5px solid var(--line); background:#fff; padding:7px 13px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;}
.btn-mini:hover{border-color:var(--accent); color:var(--accent-deep);}
table.tilik-tbl{width:100%; border-collapse:collapse; font-size:13px;}
table.tilik-tbl th, table.tilik-tbl td{border:1px solid var(--line); padding:8px 10px; vertical-align:middle;}
table.tilik-tbl th{background:var(--bg); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--muted);}
table.tilik-tbl td.tn{width:34px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12px;}
table.tilik-tbl td.tscore{width:32px; text-align:center;}
table.tilik-tbl tr.grp td{background:var(--accent-tint); font-weight:700; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent-deep);}
table.tilik-tbl input[type=radio]{cursor:pointer;}
.tilik-foot{display:flex; justify-content:flex-end; gap:24px; margin-top:14px; font-size:13px; padding:12px 14px; background:var(--bg); border-radius:8px;}
.tilik-foot b{font-family:'IBM Plex Mono',monospace; color:var(--accent-deep);}
.tilik-legend{font-size:11.5px; color:var(--muted); margin-top:10px;}

/* KPSP widget */
.kpsp-age-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
.kpsp-age-row button{border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--muted);}
.kpsp-age-row button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.kpsp-q{display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--line); align-items:flex-start;}
.kpsp-q:first-of-type{border-top:none;}
.kpsp-q .qn{width:24px;height:24px;border-radius:50%; background:var(--bg); border:1.5px solid var(--line); flex-shrink:0;display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--muted);}
.kpsp-q .qt{flex:1; font-size:13.5px;}
.kpsp-q .qa{display:flex; gap:6px; flex-shrink:0;}
.kpsp-q .qa button{border:1.5px solid var(--line); background:#fff; border-radius:7px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted);}
.kpsp-q .qa button.sel-ya{background:var(--teal); border-color:var(--teal); color:#fff;}
.kpsp-q .qa button.sel-tidak{background:var(--rose); border-color:var(--rose); color:#fff;}
.kpsp-result{margin-top:20px; padding:18px 20px; border-radius:10px; background:var(--accent-tint); border:1px solid #b7d4cf; font-size:14px;}
.kpsp-result .rscore{font-family:'Fraunces',serif; font-size:34px; color:var(--accent-deep);}
.kpsp-result .rlabel{font-weight:700; margin-top:4px;}

.topic-nav{display:flex; justify-content:space-between; margin-top:56px; padding-top:22px; border-top:1px solid var(--line); gap:14px;}
.tn-btn{flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:14px 16px; cursor:pointer; max-width:48%;}
.tn-btn .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}
.tn-btn .ttl{font-family:'Fraunces',serif; font-size:15px; margin-top:3px;}
.tn-btn.next{text-align:right; margin-left:auto;}

.reveal{opacity:0; transform:translateY(10px); animation:rise .4s ease forwards;}
@keyframes rise{to{opacity:1; transform:none;}}

@media (max-width:880px){
  #sidebar{position:fixed; left:0; top:0; z-index:50; transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(0,0,0,0.25); width:280px;}
  #sidebar.open{transform:translateX(0);}
  .sb-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:40;}
  .sb-overlay.show{display:block;}
  .topbar{display:flex;}
  .hamburger{display:flex;}
  .content-wrap{padding:32px 18px 90px;}
  .topic-nav{flex-direction:column;}
  .tn-btn{max-width:100%;}
  table.tilik-tbl{font-size:11.5px;}
}
@media print{
  #sidebar,.topbar,.tabbar,.topic-nav,.btn-mini{display:none !important;}
  .tabpane{display:block !important;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div class="sb-overlay" id="sbOverlay"></div>
<div id="app">
  <aside id="sidebar">
    <a class="back-home-link" href="../">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Semua Mata Kuliah
    </a>
    <div class="sb-brand" id="sbBrandHome">
      <div class="cell"></div>
      <div>
        <div class="t1">Penuntun OSCE</div>
        <div class="t2">Semester 4 · FK</div>
      </div>
    </div>
    <div class="watermark">Gastrointestinal · Reproduksi · Tumbuh Kembang</div>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Cari keterampilan…" autocomplete="off">
    </div>
    <div class="blok-toggle">
      <button id="btnBlokAll" class="active">Semua</button>
      <button id="btnBlokGastro">Gastro</button>
      <button id="btnBlokRepro">Repro & TK</button>
    </div>
    <nav id="navTree"></nav>
  </aside>

  <main id="main">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <b style="font-family:'Fraunces',serif;">Penuntun OSCE</b>
    </div>
    <div id="viewRoot"></div>
  </main>

<script id="kpsp-data" type="application/json">{"3 bulan": ["Pada waktu bayi telentang, apakah masing-masing lengan dan tungkai bergerak dengan mudah? Jawab TIDAK bila salah satu atau kedua tungkai atau lengan bayi bergerak tak terarah/tak terkendali.", "Pada waktu bayi telentang apakah ia melihat clan menatap wajah anda?", "Apakah bayi dapat mengeluarkan suara-suara lain (ngoceh), disamping menangis?", "Pada waktu bayi telentang, apakah ia dapat mengikuti gerakan anda dengan menggerakkan kepalanya dari kanan/kiri ke tengah?", "Pada waktu bayi telentang, apakah. ia dapat mengikuti gerakan anda dengan menggerakkan kepalanya dari satu sisi hampir sampai pada sisi yang lain?", "Pada waktu anda mengajak bayi berbicara dan tersenyum,apakah ia tersenyum kembali kepada anda?", "Pada waktu bayi telungkup di alas yang datar, apakah ia dapat mengangkat kepalanya seperti pada gambar ini?", "Pada waktu bayi telungkup di alas yang datar, apakah ia dapat mengangkat kepalanya sehingga", "Pada waktu bayi telungkup di alas yang datar, apakah ia dapat mengangkat kepalanya dengan tegak seperti pada gambar?", "Apakah bayi suka tertawa keras walau tidak digelitik atau diraba-raba?"], "6 bulan": ["Pada waktu bayi telentang, apakah ia dapat mengikuti gerakan anda dengan menggerakkan kepala sepenuhnya dari satu sisi ke sisi yang lain?", "Dapatkah bayi mempertahankan posisi kepala dalam keadaan tegak clan stabil? Jawab TIDAK bila kepala bayi cenderung jatuh ke kanan/kiri atau ke dadanya", "Sentuhkan pensil di punggung tangan atau ujung jari bayi. (**[jangan meletakkan di atas]{.underline} [telapak tangan bayi]{.underline}**). Apakah bayi dapat menggenggam pensil itu selama beberapa detik?", "Ketika bayi telungkup di alas datar, apakah ia dapat mengangkat dada dengan kedua lengannya sebagai penyangga seperti padA gambar ?", "Pernahkah bayi mengeluarkan suara gembira bernada tinggi atau memekik tetapi bukan menangis?", "Pernahkah bayi berbalik paling sedikit dua kali, dari telentang ke telungkup atau sebaliknya?", "Pernahkah anda melihat bayi tersenyurn ketika melihat mainan yang lucu, gambar atau binatang peliharaan pada saat ia bermain sendiri?", "Dapatkah bayi mengarahkan matanya pada benda kecil sebesar kacang, kismis atau uang logam? Jawab TIDAK jika ia tidak dapat mengarahkan matanya.", "Dapatkah bayi meraih mainan yang diletakkan agak jauh namun masih berada dalam jangkauan tangannya?", "Pada posisi bayi telentang, pegang kedua tangannya lalu tarik perlahan-lahan ke posisi clucluk. Dapatkah bayi mempertahankan lehernya secara kaku seperti gambar di sebelah kiri ? Jawab TIDAK bila kepala bayi jatuh kembali seperti gambar sebelah kanan."], "9 bulan": ["Pada posisi bayi telentang, pegang kedua tangannya lalu tarik perlahan-lahan ke posisi clucluk. Dapatkah bayi mempertahankan lehernya secara kaku seperti gambar di sebelah kiri ? Jawab TIDAK bila kepala bayi jatuh kembali seperti gambar sebelah kanan.", "Pernahkah anda melihat bayi memindahkan mainan atau kue kering dari satu tangan ke tangan yang lain? Benda-benda panjang seperti sendok atau kerincingan bertangkai tidak ikut dinilai.", "Tarik perhatian bayi dengan memperlihatkan selendang, sapu tangan atau serbet, kemudian jatuhkan ke lantai. Apakah bayi mencoba mencarinya? Misalnya mencari di bawah meja atau di belakang kursi?", "Apakah bayi dapat memungut dua benda seperti mainan/kue kering, dan masing-masing tangan memegang satu benda pada saat yang sama? Jawab TIDAK bila bayi tidak pernah melakukan perbuatan ini.", "Jika anda mengangkat bayi melalui ketiaknya ke posisi berdiri, dapatkah ia menyangga sebagian berat badan dengan kedua kakinya? Jawab YA bila ia mencoba berdiri dan sebagian berat badan tertumpu pada kedua kakinya.", "Dapatkah bayi memungut dengan tangannya benda-benda kecil seperti kismis, kacang-kacangan, potongan biskuit, dengan gerakan miring atau menggerapai seperti gambar ?", "Tanpa disangga oleh bantal, kursi atau dinding, dapatkah bayi duduk sendiri selama 60 detik?", "Apakah bayi dapat makan kue kering sendiri?", "Pada waktu bayi bermain sendiri dan anda diam-diam datang berdiri di belakangnya, apakah ia menengok ke belakang seperti mendengar kedatangan anda? Suara keras tidak ikut dihitung. Jawab YA hanya jika anda melihat reaksinya terhadap suara yang perlahan atau bisikan.", "Letakkan suatu mainan yang dinginkannya di luar jangkauan bayi, apakah ia mencoba mendapatkannya dengan mengulurkan lengan atau badannya?"], "12 bulan": ["Jika anda bersembunyi di belakang sesuatu/di pojok, kemudian muncui dan menghilang secara berulang-ulang di hadapan anak, apakah ia mencari anda atau mengharapkan anda muncul kembali?", "Letakkan pensil di telapak tangan bayi. Coba ambil pensil tersebut dengan perlahan-lahan. Sulitkah anda mendapatkan pensil itu kembali?", "Apakah anak dapat berdiri selama 30 detik atau lebih dengan berpegangan pada kursi/meja?", "Apakah anak dapat mengatakan 2 suku kata yang sama, misalnya: \"ma-ma\", \"da-da\" atau \"pa- pa\". Jawab YA bila ia mengeluarkan salah---satu suara tadi.", "Apakah anak dapat mengangkat badannya ke posisi berdiri tanpa bantuan anda?", "Apakah anak dapat membedakan anda dengan orang yang belum ia kenal? la akan menunjukkan sikap malu-malu atau ragu-ragu pada saat permulaan bertemu dengan orang yang belum dikenalnya.", "Apakah anak dapat mengambil Benda kecil seperti kacang atau kismis, dengan meremas di antara ibu jari dan jarinya seperti pada gambar?", "Apakah anak dapat duduk sendiri tanpa bantuan?", "Sebut 2-3 kata yang dapat ditiru oleh anak (tidak perlu kata-kata yang lengkap). Apakah ia mencoba meniru menyebutkan kata-kata tadi ?", "Tanpa bantuan, apakah anak dapat mempertemukan dua kubus kecil yang ia pegang? Kerincingan bertangkai dan tutup panel tidak ikut dinilai."], "15 bulan": ["Tanpa bantuan, apakah anak dapat mempertemukan dua kubus kecil yang ia pegang? Kerincingan bertangkai dan tutup, panci tidak ikut dinilai", "Apakah anak dapat jalan sendiri atau jalan dengan berpegangan?", "Tanpa bantuan, apakah anak dapat bertepuk tangan atau melambai-lambai? Jawab TIDAK bila ia membutuh kemandirian atau bantuan.", "Apakah anak dapat mengatakan \"papa\" ketika ia memanggil/melihat ayahnya, atau mengatakan \"mama\" jika memanggil/melihat ibunya? Jawab YA bila anak mengatakan salah satu diantaranya.", "Dapatkah anak berdiri sendiri tanpa berpegangan selama kira-kira 5 detik?", "Dapatkan anak berdiri sendiri tanpa berpegangan selama 30 detik atau lebih? Tanpa berpegangan atau menyentuh lantai, apakah anak dapat membungkuk untuk memungut mainan di lantai dan kemudian berdiri kembali?", "Apakah anak dapat menunjukkan apa yang diinginkannya tanpa menangis atau merengek? Jawab YA bila ia menunjuk, menarik atau mengeluarkan suara yang menyenangkan", "Apakah anak dapat berjalan di sepanjang ruangan tanpa jatuh atau terhuyung-huyung?", "Apakah anak dapat mengambil benda kecil seperti kacang, kismis, atau potongan biskuit dengan menggunakan ibu seperti pada gambar ini"], "18 bulan": ["Tanpa bantuan, apakah anak dapat bertepuk tangan atau melambai-lambai? Jawab TIDAK bila ia membutuhkan bantuan.", "Apakah anak dapat mengatakan \"papa\" ketika ia memanggil/melihat ayahnya, atau mengatakan \"mama\" jika memanggil/melihat ibunya?", "Apakah anak dapat berdiri sendiri tanpa berpegangan selama kira-kira 5 detik?", "Apakah anak dapat berdiri sendiri tanpa berpegangan selama 30 detik atau lebih?", "Tanpa berpegangan atau menyentuh lantai, apakah anak dapat membungkuk untuk memungut mainan di lantai clan kemudian berdiri kembali?", "Apakah anak dapat menunjukkan apa yang diinginkannya tanpa menangis atau merengek? Jawab YA bila ia menunjuk, menarik atau mengeluarkan suara yang menyenangkan.", "Apakah anak dapat berjalan di sepanjang ruangan tanpa jatuh atau terhuyung-huyung?", "Apakah anak anak dapat mengambil benda kecil seperti kacang, kismis, atau potongan biskuit dengan menggunakan ibu jari dan jari telunjuk seperti pada gambar ?", "Jika anda menggelindingkan bola ke anak, apakah ia menggelindingkan/melemparkan kembali bola pada anda?", "Apakah anak dapat memegang sendiri cangkir/gelas dan minum dari tempat tersebut tanpa tumpah?"], "21 bulan": ["Tanpa berpegangan atau menyentuh lantai, apakah anak dapat membungkuk untuk memungut mainan di lantai dan kemudian berdiri kembali?", "Apakah anak dapat menunjukkan apa yang diinginkannya tanpa menangis atau merengek? Jawab YA bila ia menunjuk, menarik atau mengeluarkan suara yang menyenangkan.", "Apakah anak dapat berjalan di sepanjang ruangan tanpa jatuh atau terhuyung-huyung?", "Apakah anak dapat mengambil benda kecil seperti kacang, kismis, atau potongan biskuit dengan menggunakan ibu jari clan jari telunjuk seperti pada gambar ?", "Jika anda menggelindingkan bola ke anak, apakah ia menggelindingkan/melemparkan kembali bola pada anda?", "Apakah anak dapat memegang sendiri cangkir/gelas clan minum dari tempat tersebut tanpa tumpah?", "Jika anda sedang melakukan pekerjaan rumah tangga, apakah anak meniru apa yang anda lakukan?", "Apakah anak dapat meletakkan satu kubus di atas Gerak halus Ya Tida kubus yang lain tanpa menjatuhkan kubus itu? Kubus yang digunakan ukuran 2.5-5.0 cm", "Apakah anak dapat mengucapkan paling sedikit 3 kata yang mempunyai arti selain \"papa\" dan \"mama\"?.", "Apakah anak dapat berjalan mundur 5 langkah atau lebih tanpa kehilangan keseimbangan? (Anda mungkin dapat melihatnya ketika anak menarik mainannya)"], "24 bulan": ["Jika anda sedang melakukan pekerjaan rumah tangga, apakah anak meniru apa yang anda lakukan?", "Apakah anak dapat meletakkan 1 buah kubus di atas kubus yang lain tanpa menjatuhkan kubus itu? Kubus yang digunakan ukuran 2.5 --- 5 cm.", "Apakah anak dapat mengucapkan paling sedikit 3 kata yang mempunyai arti selain \\\"papa\\\" clan \\\"mama\\\"?", "Apakah anak dapat berjalan mundur 5 langkah atau lebih tanpa kehilangankeseimbangan? (Anda mungkin dapat melihatnya ketika anak menarik mainannya).", "Dapatkah anak melepas pakaiannya seperti: baju, rok, atau celananya? (topi clan kaos kaki tidak ikut dinilai).", "Dapatkah anak berjalan naik tangga sendiri? Jawab YA jika ia naik tangga dengan posisi tegak atau berpegangan pada dinding atau pegangan tangga. Jawab TIDAK jika ia naik tangga dengan merangkak atau anda tidak membolehkan anak naik tangga atau anak harus berpegangan pada seseorang.", "Tanpa bimbingan, petunjuk atau bantuan anda, dapatkah anak menunjuk dengan benar paling sedikit satu bagian badannya (rambut, mata, hidung, mulut, atau bagian badan yang lain)?", "Dapatkah anak makan nasi sendiri tanpa banyak tumpah?", "Dapatkah anak membantu memungut mainannya sendiri atau membantu mengangkat piring jika diminta?", "Dapatkah anak menendang bola kecil (sebesar bola tenis) ke depan tanpa berpegangan pada apapun? Mendorong tidak ikut dinilai."], "30 bulan": ["Dapatkah anak melepas pakaiannya seperti: baju, rok, Sosialisasi & atau celananya? (topi clan kaos kaki tidak ikut dinilai)", "Dapatkah anak berjalan naik tangga sendiri? Jawab YA jika ia naik tangga dengan posisi tegak atau berpegangan pada Binding atau pegangan tangga. Jawab TIDAK jika ia naik tangga dengan merangkak atau anda tidak membolehkan anak naik tangga atau anak harus berpegangan pada seseorang.", "Tanpa bimbingan, petunjuk atau bantuan anda, dapatkah anak menunjuk dengan benar paling seclikit satu bagian badannya (rambut, mata, hidung, mulut, atau bagian badan yang lain)?", "Dapatkah anak makan nasi sendiri tanpa banyak tumpah?", "Dapatkah anak membantu memungut mainannya sendiri atau membantu mengangkat piring jika diminta?", "Dapatkah anak menendang bola kecil (sebesar bola tenis) Gerak kasar ke depan tanpa berpegangan pada apapun? Mendorong tidak ikut dinilai.", "Bila diberi pensil, apakah anak mencoret-coret kertas tanpa bantuan/petunjuk?", "Dapatkah anak meletakkan 4 buah kubus satu persatu di atas kubus yang lain tanpa menjatuhkan kubus itu? Kubus yang digunakan ukuran 2.5 -- 5 cm.", "Dapatkah anak menggunakan 2 kata pada saat berbicara seperti \"minta minum\", \"mau tidur\"? \"Terimakasih\" dan \"Dadag\" tidak ikut dinilai.", "Apakah anak dapat menyebut 2 diantara gambar-gambar ini tanpa bantuan?"], "36 bulan": ["Bila diberi pensil, apakah anak mencoret-coret kertas tanpa bantuan/petunjuk?", "Dapatkah anak meletakkan 4 buah kubus satu persatu di atas kubus yang lain tanpa menjatuhkan kubus itu? Kubus yang digunakan ukuran 2.5 -- 5 cm.", "Dapatkah anak menggunakan 2 kata pada saat berbicara seperti \"minta minum\"; \"mau tidur\"? \"Terimakasih\" dan \"Dadag\" tidak ikut dinilai.", "Apakah anak dapat menyebut 2 diantara gambar-gambar ini tanpa bantuan?", "Dapatkah anak melempar bola lurus ke arah perut atau dada anda dari jarak 1,5 meter?", "Ikuti perintah ini dengan seksama. Jangan memberi isyarat dengan telunjuk atau mata pada saat memberikan perintah berikut ini:", "Buat garis lurus ke bawah sepanjang sekurangkurangnya 2.5 cm. Suruh anak menggambar garis lain di", "Letakkan selembar kertas seukuran buku di lantai. Apakah anak dapat melompati bagian lebar kertas dengan mengangkat kedua kakinya secara bersamaan tanpa didahului lari?", "Dapatkah anak mengenakan sepatunya sendiri?", "Dapatkah anak mengayuh sepeda roda tiga sejauh sedikitnya 3 meter?"], "42 bulan": ["Dapatkah anak mengenakan sepatunya sendiri?", "Dapatkah anak mengayuh sepeda rods tiga sejauh sedikitnya 3 meter?", "Setelah makan, apakah anak mencuci clan mengeringkan tangannya dengan balk sehingga anda ticlak perlu mengulanginya?", "Suruh anak berdiri satu kaki tanpa berpegangan. Jika perlu tunjukkan caranya clan beri anak anda kesempatan melakukannya 3 kali. Dapatkah ia mempertahankan keseimbangan dalam waktu 2 detik atau lebih?", "Letakkan selembar kertas seukuran buku ini di lantai. Apakah anak dapat melompati panjang kertas ini dengan mengangkat kedua kakinya secara bersamaan tanpa didahului lari?", "Jangan membantu anak clan jangan menyebut lingkaran. Suruh anak menggambar seperti contoh ini di kertas kosong yang tersedia. Dapatkah anak menggambar lingkaran?", "Dapatkah anak meletakkan 8 buah kubus satu persatu di atas yang lain tanpa menjatuhkan kubus tersebut?", "Apakah anak dapat bermain petak umpet, ular naga atau permainan lain dimana ia ikut bermain clan mengikuti aturan bermain?", "Dapatkah anak mengenakan celana panjang, kemeja, baju atau kaos kaki tanpa di bantu? (Tidak termasuk kemandirian memasang kancing, gesper atau ikat pinggang)"], "48 bulan": ["Dapatkah anak mengayuh sepeda roda tiga sejauh sedikitnya 3 meter?", "Setelah makan, apakah anak mencuci dan mengeringkan tangannya dengan baik sehingga anda tidak perlu mengulanginya?", "Suruh anak berdiri satu kaki tanpa berpegangan. Jika perlu tunjukkan caranya dan beri anak anda kesempatan melakukannya 3 kali. Dapatkah ia mempertahankan keseimbangan dalam waktu 2 detik atau lebih?", "Letakkan selembar kertas seukuran buku ini di lantai. Apakah anak dapat melompati panjang kertas ini dengan mengangkat kedua kakinya secara bersamaan tanpa didahului lari?", "Jangan membantu anak dan jangan menyebut lingkaran. Suruh anak menggambar seperti contoh ini di kertas kosong yang tersedia. Dapatkah anak menggambar lingkaran?", "Dapatkah anak meletakkan 8 buah kubus satu persatu di atas yang lain tanpa menjatuhkan kubus tersebut?", "Apakah anak dapat bermain petak umpet, ular naga atau permainan lain dimana ia ikut bermain dan mengikuti aturan bermain?", "Dapatkah anak mengenakan celana panjang, kemeja, baju atau kaos kaki tanpa di bantu? (Tidak termasuk memasang kancing, gesper atau ikat pinggang)", "Dapatkah anak menyebutkan nama lengkapnya tanpa dibantu? Jawab TIDAK jika ia hanya menyebutkan sebagian namanya atau ucapannya sulit dimengerti."], "54 bulan": ["Dapatkah anak meletakkan 8 buah kubus satu persatu di atas yang lain tanpa menjatuhkan kubus tersebut? Kubus yang digunakan ukuran 2-5 -- 5 cm.", "Apakah anak dapat bermain petak umpet, ular naga atau permainan lain dimana ia ikut bermain dan mengikuti aturan bermain?", "Dapatkah anak m nggelayut pada anda) pada saat anda meninqgalkannya?", "Jangan menunjuk, membantu atau membetulkan, katakan pada anak : \"Tunjukkan segi empat merah\"", "Suruh anak melompat dengan satu kaki beberapa kali tanpa berpegangan (lompatan dengan dua kaki tidak ikut dinilai). Apakah ia dapat melompat 2-3 kali dengan satu kaki?", "Dapatkah anak sepenuhnya berpakaian sendiri tanpa bantuan?"], "66 bulan": ["Jangan membantu anak dan jangan memberitahu nama gambar ini, suruh anak menggambar seperti contoh ini di kertas kosong yang tersedia. Berikan 3 kali kesempatan. Apakah anak dapat menggambar seperti contoh ini?", "Ikuti perintah ini dengan seksama. Jangan memberi isyarat dengan telunjuk atau mats pads saat memberikan perintah berikut ini: \\\"Letakkan kertas ini di atas lantai\\\".", "Apakah anak bereaksi dengan tenang dan tidak rewel (tanpa menangis atau menggelayut pada anda) pada saat anda meninqgalkannya?", "Jangan menunjuk, membantu atau membetulkan, katakan pada anak :", "Suruh anak melompat dengan satu kaki beberapa kali tanpa berpegangan (lompatan dengan dua kaki tidak ikut dinilai). Apakah ia dapat melompat 2-3 kali dengan satu kaki?", "Dapatkah anak sepenuhnya berpakaian sendiri tanpa bantuan?", "Suruh anak menggambar di tempat kosong yang tersedia. Katakan padanya: \\\"Buatlah gambar orang\\\".", "Pada gambar orang yang dibuat pada nomor 7, dapatkah anak menggambar sedikitnya 6 bagian tubuh?", "Tulis apa yang dikatakan anak pada kalimat-kalimat yang belum selesai ini, jangan membantu kecuali mengulang pertanyaan:", "Apakah anak dapat menangkap bola kecil sebesar bola tenis/bola kasti hanya dengan menggunakan kedua tangannya? (Bola besar tidak ikut dinilai)."], "72 bulan": ["Jangan menunjuk, membantu atau membetulkan, katakan pada anak :", "Suruh anak melompat dengan satu kaki beberapa kali tanpa berpegangan (lompatan dengan dua kaki tidak ikut dinilai). Apakah ia dapat melompat 2-3 kali dengan satu kaki?", "Dapatkah anak sepenuhnya berpakaian sendiri tanpa bantua     {g:'G. Leopold IV', items:[

      'Pindahkan ibu jari dan telunjuk kiri ke bagian terbawah janin (kepala: pegang dekat leher; bokong: pegang pinggang).',
      'Fiksasi bagian tersebut ke pintu atas panggul, letakkan jari tangan kanan di antara tangan kiri dan simfisis untuk menilai seberapa jauh bagian terbawah memasuki pintu atas panggul.',

    {g:'H. Auskultasi Denyut Jantung Janin', items:[
      'Angkat kedua tangan dari dinding perut, ambil stetoskop monoaural (Laenec) dengan tangan kiri, tempelkan pada dinding perut sesuai posisi punggung janin (bagian memanjang & rata).',

      'Beritahu pemeriksaan selesai, angkat kain penutup, rapikan kembali pakaian ibu.',

      'Serahkan kembali buku kontrol ibu hamil dan ucapkan salam.',

{
  id:'ginekologi', blok:'repro', title:'Pemeriksaan Ginekologi',
  sub:'Pemasangan spekulum vagina (inspekulo) dan pemeriksaan bimanual uterus-adneksa.',
  tujuan:['Melakukan anamnesis berhubungan dengan keluhan organ genitalia wanita.','Melakukan pemasangan spekulum vagina dengan benar dan aman.','Melakukan pemeriksaan bimanual dengan benar.','Menegakkan diagnosis dan diagnosis banding.'],
  teori:[
    {h:'Tujuan Klinis', list:[
      'Pemeriksaan ginekologi adalah prosedur klinik bimanual untuk menilai kondisi organ genitalia wanita, mencakup arah, besar, konsistensi uterus dan serviks, kondisi adneksa, parametrium, dan organ sekitar genitalia interna.',
      'Indikasi: menilai bentuk/arah/besar/konsistensi uterus; adneksa dan parametrium; ballotement; konfirmasi kehamilan intra/ekstrauterin; konfirmasi peradangan/infeksi; fluor albus, perdarahan, dan tumor pelvik.',
    ]},
  ],
  prosedur:[
    {g:'A. Anamnesis & Persetujuan', items:[
      'Menyapa pasien dan memperkenalkan diri.',
      'Anamnesis sistematis: identitas, keluhan utama, perjalanan penyakit, jumlah anak, siklus haid, riwayat berobat.',
      'Jelaskan prosedur, tujuan pemeriksaan, dan kemungkinan rasa tidak nyaman; pastikan pasien mengerti; minta persetujuan lisan.',
    ]},
    {g:'B. Persiapan Pasien & Alat', items:['Siapkan alat pada klien: kapas & antiseptik, spekulum cocor bebek (Grave), penjepit kasa, meja instrumen & lampu sorot, ranjang ginekologi dengan penopang kaki.','Siapkan alat pemeriksa: apron & baju periksa, sarung tangan DTT, sabun, air bersih, handuk.']},
    {g:'C. Inspeksi & Inspekulo', items:[
      'Pasien posisi litotomi; inspeksi vulva dan perineum.',
      'Buka celah kedua labium mayus, perhatikan muara uretra dan introitus (kosongkan kandung kemih bila perlu).',
      'Raba dan telusuri labium mayus kanan-kiri (terutama kelenjar Bartolini) dengan ibu jari dan telunjuk.',
      'Ambil spekulum dengan tangan kanan, masukkan ujung telunjuk kiri pada introitus (agar terbuka), masukkan spekulum arah sejajar introitus, dorong bilah ke lumen vagina.',
      'Setelah masuk setengah panjang bilah, putar spekulum 90° hingga tangkai ke bawah; buka kunci pengatur bilah atas-bawah hingga menyentuh dinding vagina.',
      'Tekan pengungkit bilah hingga lumen vagina dan serviks tampak jelas — perhatikan ukuran/warna porsio, dinding, sekret vagina/forniks.',
      'Setelah inspeksi selesai, lepaskan pengungkit dan pengatur jarak bilah, keluarkan spekulum, letakkan pada tempat yang disediakan.',
    ]},
    {g:'D. Pemeriksaan Bimanual (Vaginal Toucher)', items:[
      'Berdiri untuk tuse vaginal; buka labium mayus kiri-kanan dengan ibu jari dan telunjuk tangan kiri; masukkan jari telunjuk dan tengah tangan kanan ke vagina.',
      'Letakkan ujung jari tangan kiri di suprasimfisis, tentukan tinggi fundus uteri (bila teraba dari luar).',
      'Tangan dalam memeriksa dinding vagina; secara bimanual tentukan besar, konsistensi, dan arah uterus; periksa konsistensi serviks, keadaan parametrium, dan kedua adneksa.',
      'Pindahkan jari tangan luar-dalam ke isthmus, coba pertemukan ujung jari luar-dalam untuk menilai <b>tanda Hegar</b>.',
      'Tangan kiri menahan uterus di suprasimfisis, keluarkan jari tengah dan telunjuk tangan kanan.',
      'Angkat tangan kiri dari dinding perut, usap larutan antiseptik pada bekas sekret di dinding perut dan sekitar vulva/perineum.',
      'Beritahu ibu pemeriksaan selesai, persilakan duduk kembali.',
    ]},
    {g:'E. Pencegahan Infeksi & Penjelasan Hasil', items:[
      'Kumpulkan alat, rendam dalam larutan klorin 0,5% selama 10 menit; buang bahan habis pakai ke tempat sampah medis; seka bagian tercemar dengan larutan klorin.',
      'Lepas sarung tangan secara aseptik, rendam, cuci tangan dengan sabun & air mengalir.',
      'Jelaskan hasil pemeriksaan, diagnosis, dan rencana pengobatan; pastikan pasien mengerti; minta persetujuan tertulis bila perlu tindakan lanjut.',
    ]},
  ],
  interpretasi:[
    'Tanda Hegar (ismus uteri teraba lunak, ujung jari dalam-luar mudah bertemu) → tanda dugaan kehamilan.',
    'Uterus membesar, lunak, nyeri goyang porsio positif → curiga infeksi pelvis (PID) atau kehamilan ektopik terganggu bila disertai tanda syok.',
    'Massa adneksa unilateral, nyeri, riwayat terlambat haid → curiga kehamilan ektopik; massa kistik tanpa nyeri → curiga kista ovarium.',
    'Porsio livide (kebiruan) dan lunak → tanda kehamilan (tanda Chadwick).',
    'Fluor albus abnormal (berbau, berwarna, gatal) pada inspekulo → curiga infeksi/vaginosis/servisitis.',
  ],
},

{
  id:'akdr', blok:'repro', title:'Pemasangan & Pencabutan AKDR (IUD)',

  tujuan:['Meningkatkan sikap positif terhadap manfaat dan pemakaian AKDR yang tepat; melakukan seleksi klien.','Melaksanakan praktik pencegahan infeksi untuk mengurangi risiko pasca pemasangan.','Memasang AKDR Cu T 380A dengan teknik "tanpa sentuh" (no-touch technique).','Memberikan konseling sebelum dan sesudah pemasangan; menjelaskan indikasi pencabutan; mencabut AKDR.'],
  alat:['AKDR Cu T 380A dalam kemasan steril','Spekulum cocor bebek','Tenakulum, sonde rahim','Gunting, tampon tang, klem aligator','Sarung tangan, kain penutup tubuh','Larutan antiseptik, larutan klorin 0,5%'],
  prosedur:[

    {g:'B. Konseling Metode Khusus', items:['Berikan jaminan kerahasiaan.','Kumpulkan data pribadi klien.','Tanyakan tujuan KB (mengatur jarak/membatasi jumlah anak) dan pertimbangan agama/kepercayaan.','Diskusikan kebutuhan dan kekhawatiran klien dengan sikap simpatik; bantu memilih metode yang tepat.','Bila klien memilih AKDR, jelaskan kemungkinan efek samping AKDR Cu T 380A sampai benar-benar dimengerti.']},
    {g:'C. Konseling Pra-pemasangan & Seleksi Klien', items:['Lakukan seleksi klien (anamnesis) cermat memastikan tidak ada kontraindikasi AKDR.','Lakukan pemeriksaan fisik umum dan pemeriksaan panggul: inspeksi vulva, inspekulo (nilai sekret vagina/porsio), bersihkan vagina-porsio dengan kasa + antiseptik.']},
    {g:'D. Pemeriksaan Bimanual Pra-pemasangan', items:['Keluarkan spekulum dengan hati-hati, letakkan pada tempat semula.','Pemeriksaan bimanual: pastikan gerakan serviks bebas, tentukan besar & posisi uterus, pastikan tidak ada kehamilan, tidak ada infeksi/tumor adneksa.','Pemeriksaan rektovaginal bila ada indikasi (sulit menentukan besar uterus retroversi, tumor cavum Douglasi).','Celupkan sarung tangan ke larutan klorin 0,5%, buka dalam keadaan terbalik dan rendam.']},
    {g:'E. Tindakan Pra-pemasangan (Memasukkan AKDR ke Inserter)', items:[
      'Jelaskan proses pemasangan dan apa yang akan klien rasakan; beri kesempatan bertanya.',
      'Buka sebagian plastik penutup kemasan dan lipat ke belakang; masukkan pendorong ke tabung inserter tanpa menyentuh benda tidak steril.',
      'Letakkan kemasan pada bidang datar; selipkan karton pengukur di bawah lengan AKDR.',
      'Pegang kedua ujung lengan AKDR, dorong tabung inserter sampai pangkal lengan hingga lengan melipat.',
      'Setelah lengan melipat, tarik tabung inserter dari bawah lipatan lengan; angkat sedikit, dorong dan putar untuk memasukkan lengan AKDR yang terlipat ke tabung inserter.',
      'Pastikan cincin biru sejajar arah lengan AKDR (cocokkan ukuran kavum uteri); pastikan ujung pendorong menyentuh ujung AKDR — AKDR siap diinsersikan.',

    {g:'F. Tindakan Pemasangan AKDR', items:[
      'Kenakan sarung tangan baru; pasang spekulum vagina untuk melihat serviks.',
      'Usap vagina & serviks dengan antiseptik 2–3 kali.',
      'Jepit serviks dengan tenakulum secara hati-hati (takik pertama).',
      'Masukkan sonde uterus dengan teknik <b>tidak menyentuh</b> — sekali masuk tanpa menyentuh dinding vagina/bibir spekulum. Tentukan posisi & kedalaman kavum uteri, keluarkan sonde.',
      'Ukur kedalaman kavum uteri pada tabung inserter (masih dalam kemasan steril) dengan menggeser leher biru; buka seluruh plastik penutup kemasan.',
      'Angkat tabung AKDR dari kemasan tanpa menyentuh permukaan tidak steril, hati-hati pendorong tidak terdorong.',
      'Pegang tabung dengan leher biru horizontal (sejajar lengan AKDR); sambil menarik hati-hati tenakulum, masukkan tabung inserter ke uterus sampai leher biru menyentuh serviks/terasa tahanan.',
      'Tahan tenakulum dan pendorong dengan satu tangan.',
      'Lepaskan lengan AKDR dengan teknik <b>withdrawal</b> — tarik tabung inserter sampai pangkal pendorong dengan tetap menahan pendorong.',

      'Keluarkan sebagian tabung inserter, gunting benang AKDR ±3–4 cm.',
      'Keluarkan seluruh tabung inserter, buang ke tempat sampah terkontaminasi.',

    {g:'G. Tindakan Pasca Pemasangan', items:['Rendam semua alat dalam larutan klorin 0,5% selama 10 menit untuk dekontaminasi.','Buang bahan tidak terpakai ke tempat sampah medis.','Celupkan sarung tangan ke klorin, lepas terbalik dan rendam; cuci tangan.','Amati klien selama 5 menit sebelum diperbolehkan pulang; konseling pasca pemasangan.']},
    {g:'H. Pencabutan AKDR', items:['Lakukan konseling pra-pencabutan dan konfirmasi keinginan klien.','Pasang spekulum, visualisasikan benang AKDR pada serviks.','Jepit benang AKDR dekat serviks dengan klem/tampon tang, tarik perlahan dan mantap searah kanalis servikalis hingga AKDR keluar.','Tunjukkan AKDR yang sudah dicabut kepada klien.']},
    {g:'I. Konseling Pasca Pencabutan', items:[

      'Ulangi keterangan pilihan kontrasepsi lain bila klien ingin tetap mengatur jarak/membatasi jumlah anak; bantu tentukan kontrasepsi baru atau berikan kontrasepsi sementara.',
      'Buat rekam medik tentang pencabutan AKDR.',
    ]},
  ],

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const viewRoot = $('#viewRoot');
function esc(s){ return (s+'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function findTopic(id){ return TOPICS.find(t=>t.id===id); }
function blokLabel(id){ return BLOKS.find(b=>b.id===id).label; }
function topicsFiltered(){ return state.blokFilter==='all' ? TOPICS : TOPICS.filter(t=>t.blok===state.blokFilter); }

/* ---------- Sidebar nav ---------- */
function renderNavTree(filter){
  const q = (filter||'').trim().toLowerCase();
  let list = topicsFiltered();
  if(q){
    list = list.filter(t => t.title.toLowerCase().includes(q) || (t.sub||'').toLowerCase().includes(q));
  }
  let html = '';
  BLOKS.forEach(b=>{
    if(state.blokFilter!=='all' && state.blokFilter!==b.id) return;
    const topics = list.filter(t=>t.blok===b.id);
    if(!topics.length) return;
    html += `<div class="nav-cat"><div class="nav-cat-head">${esc(b.label)}</div>`;
    topics.forEach(t=>{
      html += `<div class="nav-item ${t.id===state.topicId?'active':''}" data-topic="${t.id}"><span class="dot"></span><span>${esc(t.title)}</span></div>`;
    });
    html += `</div>`;
  });
  $('#navTree').innerHTML = html || '<div style="padding:10px 8px;color:var(--muted);font-size:12.5px;">Tidak ditemukan.</div>';
  $$('.nav-item').forEach(it=>{
    it.addEventListener('click', ()=>{ goTopic(it.dataset.topic); closeSidebarMobile(); });
  });
}

        <div class="stat"><b>${TOPICS.length}</b><span>Keterampilan</span></div>
        <div class="stat"><b>${gastroCount}</b><span>Gastrointestinal</span></div>
        <div class="stat"><b>${reproCount}</b><span>Reproduksi & TK</span></div>
      </div>
    </div>

    <div class="blok-grid reveal">
      <div class="blok-card gastro ${state.blokFilter==='gastro'?'active-blok':''}" data-blok="gastro">
        <div class="bn">Blok Gastrointestinal</div>
        <h3>Sistem Pencernaan</h3>
        <p>Pemeriksaan abdomen, hernia, NGT, dan colok dubur.</p>
      </div>
      <div class="blok-card repro ${state.blokFilter==='repro'?'active-blok':''}" data-blok="repro">
        <div class="bn">Blok Reproduksi & Tumbuh Kembang</div>
        <h3>Obstetri, Ginekologi & Anak</h3>
        <p>Leopold, ginekologi, Pap smear, IVA, AKDR, APN, status gizi, DDST & KPSP.</p>
      </div>
    </div>

    <div style="margin-top:44px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <h2 style="font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); font-weight:600;">${esc(sectionTitle)}</h2>
        ${state.blokFilter!=='all' ? `<button id="clearBlokBtn" style="border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 12px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer;">Tampilkan semua ✕</button>` : ''}
      </div>
      <div class="home-grid">
        ${shown.map((t,i)=>`
          <div class="home-card reveal" style="animation-delay:${Math.min(i*15,260)}ms" data-topic="${t.id}">
            <div class="n">${esc(blokLabel(t.blok))}</div>
            <h4>${esc(t.title)}</h4>
            <p>${esc(t.sub||'')}</p>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
  $$('.blok-card').forEach(c=>c.addEventListener('click', ()=>{
    const b = c.dataset.blok;
    setBlokFilter(state.blokFilter===b ? 'all' : b);
  }));
  const clearBtn = $('#clearBlokBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=> setBlokFilter('all'));
  $$('.home-card').forEach(c=>c.addEventListener('click', ()=>goTopic(c.dataset.topic)));
  renderNavTree($('#searchInput').value);
}

function setBlokFilter(id){
  state.blokFilter = id;
  $('#btnBlokAll').classList.toggle('active', id==='all');
  $('#btnBlokGastro').classList.toggle('active', id==='gastro');
  $('#btnBlokRepro').classList.toggle('active', id==='repro');
  renderNavTree($('#searchInput').value);
  if(state.view==='home') renderHome(false);
}

/* ---------- Topic page ---------- */
function renderProsedurGroups(groups, mode){
  // mode: 'proc' normal display; used also to build flattened list for tilik
  return groups.map(g=>`
    <div class="proc-group">
      <div class="proc-group-title">${esc(g.g)}</div>
      ${g.items.map((it,i)=>`<div class="proc-step"><div class="pn">${i+1}</div><div class="pb">${it}</div></div>`).join('')}
    </div>`).join('');
}

function flattenSteps(groups){
  const out = [];
  groups.forEach(g=>{ g.items.forEach(it=>out.push({g:g.g, text:it})); });
  return out;
}

function renderTeoriTab(t){
  let html = '';
  if(t.tujuan && t.tujuan.length){
    html += `<div class="section-block"><h2>Tujuan Pembelajaran</h2><ul>${t.tujuan.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }
  if(t.alat && t.alat.length){
    html += `<div class="section-block"><h2>Alat & Bahan</h2><ul>${t.alat.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  }
  (t.teori||[]).forEach(sec=>{
    html += `<div class="section-block"><h2>${esc(sec.h)}</h2><ul>${sec.list.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  });
  if(t.table){
    html += `<div class="section-block"><h2>${esc(t.table.title)}</h2><table class="data-tbl"><thead><tr>${t.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  if(!html) html = '<p style="color:var(--muted);">Tidak ada materi teori tambahan untuk topik ini.</p>';
  return html;
}

function renderProsedurTab(t){
  return `<div class="section-block" style="margin-top:0;"><h2>Langkah Klinik</h2>${renderProsedurGroups(t.prosedur)}</div>`;
}

function renderInterpretasiTab(t){
  if(!t.interpretasi || !t.interpretasi.length) return '<p style="color:var(--muted);">Tidak ada catatan interpretasi khusus — nilai hasil sesuai temuan klinis pada langkah pemeriksaan.</p>';
  return `<div class="section-block" style="margin-top:0;"><h2>Interpretasi Hasil</h2><ul>${t.interpretasi.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

function renderTilikTab(t){
  const steps = flattenSteps(t.prosedur);
  let rows = '';
  let lastG = null;
  steps.forEach((s,i)=>{
    if(s.g !== lastG){ rows += `<tr class="grp"><td colspan="6">${esc(s.g)}</td></tr>`; lastG = s.g; }
    rows += `<tr data-idx="${i}">
      <td class="tn">${i+1}</td>
      <td>${s.text.replace(/<[^>]+>/g,'')}</td>
      <td class="tscore"><input type="radio" name="tilik-${i}" value="0"></td>
      <td class="tscore"><input type="radio" name="tilik-${i}" value="1"></td>
      <td class="tscore"><input type="radio" name="tilik-${i}" value="2"></td>
    </tr>`;
  });
  return `
  <div class="tilik-head">
    <div class="id-fields">
      <span>Nama: <input type="text" placeholder="…"></span>
      <span>NIM: <input type="text" placeholder="…"></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-mini" id="tilikResetBtn">Reset</button>
      <button class="btn-mini" id="tilikPrintBtn">Cetak</button>
    </div>
  </div>
  <table class="tilik-tbl">
    <thead><tr><th style="width:34px;">No</th><th>Prosedur</th><th class="tscore">0</th><th class="tscore">1</th><th class="tscore">2</th></tr></thead>
    <tbody id="tilikBody">${rows}</tbody>
  </table>
  <div class="tilik-legend">0 = tidak dilakukan &nbsp;·&nbsp; 1 = dilakukan tapi tidak sempurna &nbsp;·&nbsp; 2 = dilakukan dengan sempurna</div>
  <div class="tilik-foot">
    <span>Skor total: <b id="tilikScore">0</b> / ${steps.length*2}</span>
    <span>Nilai akhir: <b id="tilikPct">0%</b></span>
  </div>`;
}

function wireTilikTab(){
  const body = $('#tilikBody');
  if(!body) return;
  function recompute(){
    let sum = 0, n = 0;
    $$('#tilikBody tr[data-idx]').forEach(tr=>{
      n++;
      const checked = tr.querySelector('input:checked');
      if(checked) sum += parseInt(checked.value,10);
    });
    $('#tilikScore').textContent = sum;
    $('#tilikPct').textContent = n ? Math.round(sum/(n*2)*100)+'%' : '0%';
  }
  body.addEventListener('change', recompute);
  $('#tilikResetBtn').addEventListener('click', ()=>{
    $$('#tilikBody input[type=radio]').forEach(i=>i.checked=false);
    recompute();
  });
  $('#tilikPrintBtn').addEventListener('click', ()=> window.print());
  recompute();
}

const TABS = [
  {id:'teori', label:'Teori & Tujuan'},
  {id:'prosedur', label:'Langkah Klinik'},
  {id:'interpretasi', label:'Interpretasi Hasil'},
  {id:'tilik', label:'Daftar Tilik'},
];

function goTopic(id, push, tab){
  state.view='topic'; state.topicId=id; state.activeTab = tab || 'teori';
  if(push!==false){ history.pushState({view:'topic', topicId:id}, '', '#'+id); }
  const t = findTopic(id);
  if(t.interactive==='kpsp'){ renderKpspTopic(t, push); renderNavTree($('#searchInput').value); window.scrollTo({top:0,behavior:'instant'}); return; }

  const idx = TOPICS.filter(x=>x.blok===t.blok).indexOf(t);
  const siblings = TOPICS.filter(x=>x.blok===t.blok);
  const prev = siblings[idx-1], next = siblings[idx+1];

  viewRoot.innerHTML = `
  <div class="content-wrap">
    <div class="crumbs reveal"><span>Penuntun OSCE Semester 4</span><span class="sep">/</span><span>${esc(blokLabel(t.blok))}</span></div>
    <div class="topic-head reveal">
      <h1>${esc(t.title)}</h1>
      <span class="badge-blok ${t.blok}">${t.blok==='gastro'?'Gastro':'Repro & TK'}</span>
    </div>
    <div class="topic-sub reveal">${esc(t.sub||'')}</div>
    <div class="tabbar">${TABS.map(tb=>`<button data-tab="${tb.id}" class="${tb.id===state.activeTab?'active':''}">${tb.label}</button>`).join('')}</div>
    <div class="tabpane ${state.activeTab==='teori'?'show':''}" data-pane="teori">${renderTeoriTab(t)}</div>
    <div class="tabpane ${state.activeTab==='prosedur'?'show':''}" data-pane="prosedur">${renderProsedurTab(t)}</div>
    <div class="tabpane ${state.activeTab==='interpretasi'?'show':''}" data-pane="interpretasi">${renderInterpretasiTab(t)}</div>
    <div class="tabpane ${state.activeTab==='tilik'?'show':''}" data-pane="tilik">${renderTilikTab(t)}</div>
    <div class="topic-nav">
      ${prev ? `<button class="tn-btn prev" data-topic="${prev.id}"><div class="lbl">← Sebelumnya</div><div class="ttl">${esc(prev.title)}</div></button>` : '<div></div>'}
      ${next ? `<button class="tn-btn next" data-topic="${next.id}"><div class="lbl">Selanjutnya →</div><div class="ttl">${esc(next.title)}</div></button>` : '<div></div>'}
    </div>
  </div>`;

  $$('.tabbar button').forEach(b=>b.addEventListener('click', ()=>{
    state.activeTab = b.dataset.tab;
    $$('.tabbar button').forEach(x=>x.classList.toggle('active', x===b));
    $$('.tabpane').forEach(p=>p.classList.toggle('show', p.dataset.pane===b.dataset.tab));
    if(b.dataset.tab==='tilik') wireTilikTab();
  }));
  if(state.activeTab==='tilik') wireTilikTab();
  $$('.tn-btn[data-topic]').forEach(b=>b.addEventListener('click', ()=>goTopic(b.dataset.topic)));

  renderNavTree($('#searchInput').value);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---------- KPSP interactive topic ---------- */
function kpspScore(){
  const ans = state.kpspAnswers[state.kpspAge] || {};
  let ya = 0, answered = 0;
  const qs = KPSP[state.kpspAge];
  qs.forEach((_,i)=>{ if(ans[i]==='ya'){ya++; answered++;} else if(ans[i]==='tidak'){answered++;} });
  return {ya, total:qs.length, answered};
}
function kpspInterpretText(ya){
  if(ya>=9) return {label:'Perkembangan Sesuai (S)', cls:'ok'};
  if(ya>=7) return {label:'Perkembangan Meragukan (M)', cls:'warn'};
  return {label:'Kemungkinan Ada Penyimpangan (P)', cls:'bad'};
}

function renderKpspTopic(t, push){
  const idx = TOPICS.filter(x=>x.blok===t.blok).indexOf(t);
  const siblings = TOPICS.filter(x=>x.blok===t.blok);
  const prev = siblings[idx-1], next = siblings[idx+1];
  viewRoot.innerHTML = `
  <div class="content-wrap">
    <div class="crumbs reveal"><span>Penuntun OSCE Semester 4</span><span class="sep">/</span><span>${esc(blokLabel(t.blok))}</span></div>
    <div class="topic-head reveal"><h1>${esc(t.title)}</h1><span class="badge-blok repro">Repro & TK</span></div>
    <div class="topic-sub reveal">${esc(t.sub||'')}</div>
    <div class="tabbar">
      <button data-tab="teori" class="${state.activeTab==='teori'?'active':''}">Teori & Tujuan</button>
      <button data-tab="interpretasi" class="${state.activeTab==='interpretasi'?'active':''}">Aturan Interpretasi</button>
      <button data-tab="kuesioner" class="${state.activeTab==='kuesioner'||state.activeTab==='prosedur'||state.activeTab==='tilik'?'active':''}">Kuesioner Interaktif</button>
    </div>
    <div class="tabpane ${state.activeTab==='teori'?'show':''}" data-pane="teori">${renderTeoriTab(t)}</div>
    <div class="tabpane ${state.activeTab==='interpretasi'?'show':''}" data-pane="interpretasi">${renderInterpretasiTab(t)}</div>
    <div class="tabpane ${(state.activeTab==='kuesioner'||state.activeTab==='prosedur'||state.activeTab==='tilik')?'show':''}" data-pane="kuesioner">
      <div class="section-block" style="margin-top:0;">
        <h2>Pilih Kelompok Usia</h2>
        <div class="kpsp-age-row" id="kpspAgeRow">
          ${KPSP_AGES.map(a=>`<button data-age="${a}" class="${a===state.kpspAge?'active':''}">${a}</button>`).join('')}
        </div>
        <div id="kpspQuestions"></div>
        <div class="kpsp-result" id="kpspResult"></div>
      </div>
    </div>
    <div class="topic-nav">
      ${prev ? `<button class="tn-btn prev" data-topic="${prev.id}"><div class="lbl">← Sebelumnya</div><div class="ttl">${esc(prev.title)}</div></button>` : '<div></div>'}
      ${next ? `<button class="tn-btn next" data-topic="${next.id}"><div class="lbl">Selanjutnya →</div><div class="ttl">${esc(next.title)}</div></button>` : '<div></div>'}
    </div>
  </div>`;

  $$('.tabbar button').forEach(b=>b.addEventListener('click', ()=>{
    state.activeTab = b.dataset.tab;
    $$('.tabbar button').forEach(x=>x.classList.toggle('active', x===b));
    $$('.tabpane').forEach(p=>p.classList.toggle('show', p.dataset.pane===b.dataset.tab));
  }));
  $$('.tn-btn[data-topic]').forEach(b=>b.addEventListener('click', ()=>goTopic(b.dataset.topic)));

  renderKpspQuestions();
  $$('#kpspAgeRow button').forEach(b=>b.addEventListener('click', ()=>{
    state.kpspAge = b.dataset.age;
    $$('#kpspAgeRow button').forEach(x=>x.classList.toggle('active', x===b));
    renderKpspQuestions();
  }));

  if(push!==false){ history.pushState({view:'topic', topicId:t.id}, '', '#'+t.id); }
}

function renderKpspQuestions(){
  const qs = KPSP[state.kpspAge];
  if(!state.kpspAnswers[state.kpspAge]) state.kpspAnswers[state.kpspAge] = {};
  const ans = state.kpspAnswers[state.kpspAge];
  $('#kpspQuestions').innerHTML = qs.map((q,i)=>`
    <div class="kpsp-q">
      <div class="qn">${i+1}</div>
      <div class="qt">${esc(q)}</div>
      <div class="qa">
        <button data-i="${i}" data-v="ya" class="${ans[i]==='ya'?'sel-ya':''}">Ya</button>
        <button data-i="${i}" data-v="tidak" class="${ans[i]==='tidak'?'sel-tidak':''}">Tidak</button>
      </div>
    </div>`).join('');
  $$('#kpspQuestions .qa button').forEach(b=>b.addEventListener('click', ()=>{
    const i = b.dataset.i, v = b.dataset.v;
    state.kpspAnswers[state.kpspAge][i] = v;
    renderKpspQuestions();
    updateKpspResult();
  }));
  updateKpspResult();
}

function updateKpspResult(){
  const {ya, total, answered} = kpspScore();
  const res = kpspInterpretText(ya);
  const colors = {ok:'var(--teal)', warn:'var(--amber)', bad:'var(--rose)'};
  $('#kpspResult').innerHTML = `
    <div class="rscore">${ya} <span style="font-size:16px;color:var(--muted);">/ ${total} jawaban YA</span></div>
    <div class="rlabel" style="color:${answered<total?'var(--muted)':colors[res.cls]}">${answered<total? `Menjawab ${answered}/${total} pertanyaan…` : res.label}</div>
  `;
}

/* ---------- Wiring: search, blok toggle, sidebar, back/forward ---------- */
$('#sbBrandHome').addEventListener('click', ()=>{ renderHome(); closeSidebarMobile(); });
$('#btnBlokAll').addEventListener('click', ()=>setBlokFilter('all'));
$('#btnBlokGastro').addEventListener('click', ()=>setBlokFilter('gastro'));
$('#btnBlokRepro').addEventListener('click', ()=>setBlokFilter('repro'));
$('#searchInput').addEventListener('input', (e)=> renderNavTree(e.target.value));

const sidebarEl = $('#sidebar'), overlayEl = $('#sbOverlay');
function openSidebarMobile(){ sidebarEl.classList.add('open'); overlayEl.classList.add('show'); }
function closeSidebarMobile(){ sidebarEl.classList.remove('open'); overlayEl.classList.remove('show'); }
$('#hamburgerBtn').addEventListener('click', openSidebarMobile);
overlayEl.addEventListener('click', closeSidebarMobile);

window.addEventListener('popstate', (e)=>{
  const st = e.state;
  if(!st || st.view==='home'){ renderHome(false); }
  else if(st.view==='topic' && findTopic(st.topicId)){ goTopic(st.topicId, false); }
  else { renderHome(false); }
  closeSidebarMobile();
});

/* Init */
renderNavTree('');
const initialHash = decodeURIComponent(location.hash.replace('#',''));
if(initialHash && findTopic(initialHash)){
  history.replaceState({view:'topic', topicId:initialHash}, '', '#'+initialHash);
  goTopic(initialHash, false);
} else {
  history.replaceState({view:'home'}, '', '#');
  renderHome(false);
}

</script>
</body>
</html>
